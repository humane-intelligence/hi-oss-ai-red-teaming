    get:
      tags:
      - analytics
      summary: Get evaluation metrics
      description: 'Return aggregate metrics for a single evaluation: submission and review/exploit tallies, activity volume,
        token spend (whole-evaluation, per scenario, and per assigned model), a day-by-day submission timeline (`submissions_by_day`,
        over the parent group''s declared span widened by this evaluation''s own submissions), and the exploit distributions
        by prompt count and by assigned model — the prompt-count buckets also carry what an exploit cost to reach. The audience
        is set by the parent group''s `metrics_access_during` / `metrics_access_after` levels; the group owner (and `evaluation_groups:manage`
        break-glass admins) can always read the full aggregate. At `members_personal_metrics`, a `view_personal_metrics` member
        gets a `personal`-scope read (the `scope` field) of their own data. Model names in the by-model distribution are shown
        as their display mask to any non-owner/admin caller when the evaluation masks models.'
