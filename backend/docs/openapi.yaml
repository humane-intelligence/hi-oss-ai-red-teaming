    ChatMessage:
      properties:
        role:
          type: string
          enum:
          - system
          - user
          - assistant
          title: Role
        content:
          anyOf:
          - type: string
          - items:
              oneOf:
              - $ref: '#/components/schemas/TextContentPart'
              - $ref: '#/components/schemas/ImageContentPart'
              discriminator:
                propertyName: type
                mapping:
                  image_url: '#/components/schemas/ImageContentPart'
                  text: '#/components/schemas/TextContentPart'
            type: array
          title: Content
      type: object
      required:
      - role
      - content
      title: ChatMessage
      description: 'One complete message in a conversation.


        `content` is either plain text or, for a multi-modal input, a list of parts

        (text + image); a model reply is always plain text. The list form serialises

        straight into litellm''s OpenAI-shape `content` via `model_dump()`, so the

        adapter needs no special handling.'
    ChatStreamParams:
      properties:
        temperature:
          anyOf:
          - type: number
            maximum: 2.0
            minimum: 0.0
          - type: 'null'
          title: Temperature
          description: Sampling temperature.
        top_p:
          anyOf:
          - type: number
            maximum: 1.0
            minimum: 0.0
          - type: 'null'
          title: Top P
          description: Nucleus-sampling probability.
        top_k:
          anyOf:
          - type: integer
            minimum: 0.0
          - type: 'null'
          title: Top K
          description: Top-k sampling cutoff.
        max_tokens:
          anyOf:
          - type: integer
            minimum: 1.0
          - type: 'null'
          title: Max Tokens
          description: Cap on generated tokens.
        frequency_penalty:
          anyOf:
          - type: number
            maximum: 2.0
            minimum: -2.0
          - type: 'null'
          title: Frequency Penalty
          description: Frequency penalty.
        presence_penalty:
          anyOf:
          - type: number
            maximum: 2.0
            minimum: -2.0
          - type: 'null'
          title: Presence Penalty
          description: Presence penalty.
        repetition_penalty:
          anyOf:
          - type: number
            minimum: 0.0
          - type: 'null'
          title: Repetition Penalty
          description: HF-style repetition penalty.
        seed:
          anyOf:
          - type: integer
          - type: 'null'
          title: Seed
          description: Deterministic-sampling seed where supported.
        stop_sequences:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Stop Sequences
          description: Sequences that abort generation.
      additionalProperties: false
      type: object
      title: ChatStreamParams
      description: 'Client-supplied inference overrides for one stream.


        `extra="forbid"`: unlike the storage-side `InferenceParams` (`extra="allow"`),

        this client-facing edge schema rejects unknown keys instead of forwarding

        them. The dedicated `system_prompt` knob is absent here, but that does not

        make system prompts server-only — a client can still pass a `role="system"`

        message in `messages`, which is intended (probing the model is the point).

        Knobs map over the model''s stored `parameters` — unless the target model is

        registered with advanced parameters disabled, in which case the whole cascade,

        including anything sent here, is dropped before the provider call and the model''s

        own defaults apply. The request still succeeds; nothing reports the omission.'
    ChatStreamRequest:
      properties:
        model_alias:
          type: string
          title: Model Alias
          description: Registry alias of the model to stream from.
          examples:
          - gpt-4o
        messages:
          items:
            $ref: '#/components/schemas/ChatMessage'
          type: array
          minItems: 1
          title: Messages
          description: Conversation so far; at least one message.
        params:
          anyOf:
          - $ref: '#/components/schemas/ChatStreamParams'
          - type: 'null'
          description: Optional per-request inference overrides.
      type: object
      required:
      - model_alias
      - messages
      title: ChatStreamRequest
      description: Body of `POST /api/v1/chat/stream`.
      example:
        messages:
        - content: Hello
          role: user
        model_alias: gpt-4o
        params:
          temperature: 0.7
    CheckResult:
      properties:
        ok:
          type: boolean
          title: Ok
        error:
          anyOf:
          - type: string
          - type: 'null'
          title: Error
      type: object
      required:
      - ok
      title: CheckResult
      description: Outcome of a single readiness dependency check.
    ConversationCreate:
      properties:
        evaluation_ai_model_id:
          type: string
          format: uuid
          title: Evaluation Ai Model Id
          description: Model assignment within the evaluation to converse with.
        conversation_group_id:
          type: string
          format: uuid
          title: Conversation Group Id
          description: Existing group (of the same evaluation) to add this conversation to.
        title:
          anyOf:
          - type: string
            maxLength: 255
          - type: 'null'
          title: Title
          description: Optional label for the conversation.
        parameters:
          $ref: '#/components/schemas/InferenceParams'
          description: Per-conversation inference-parameter overrides.
        tags:
          additionalProperties:
            type: string
            maxLength: 512
          propertyNames:
            pattern: ^(?:[A-Za-z0-9_.-]{1,64})$
          type: object
          maxProperties: 16
          title: Tags
          description: Free-form key/value tags stored on the conversation. They are folded into the model's prompt as context,
            minus any the evaluation's tagging policy no longer allows — those stay on the row but are not sent.
      additionalProperties: false
      type: object
      required:
      - evaluation_ai_model_id
      - conversation_group_id
      title: ConversationCreate
      description: 'Payload accepted by `POST /v1/scenarios/{scenario_id}/conversations`.


        The conversation starts empty (no messages). The target `scenario_id` comes

        from the path — and with it the evaluation, which the route derives from the

        scenario — and the owner from the authenticated caller; none of the three is

        in the payload. The service validates that the model assignment belongs to

        that evaluation, and that the scenario is the target group''s scenario (a

        group''s conversations all share it — a mismatch is a 409).

        `conversation_group_id` is

        **required**: every conversation belongs to a group, so it must reference an

        existing group of the caller''s within the same evaluation (create the

        group first via the conversation-groups endpoint).'
      example:
        conversation_group_id: 5d2e1f0a-6b7c-4d8e-9f0a-1b2c3d4e5f60
        evaluation_ai_model_id: 7c9e6679-7425-40de-944b-e07fc1f90ae7
        parameters:
          temperature: 0.2
        title: Jailbreak attempt — roleplay framing
    ConversationGroupCreate:
      properties:
        name:
          type: string
          maxLength: 255
          minLength: 1
          title: Name
          description: Display name for the group.
        models:
          items:
            $ref: '#/components/schemas/ConversationGroupModelEntry'
          type: array
          minItems: 1
          title: Models
          description: One entry per conversation to open in the group.
      additionalProperties: false
      type: object
      required:
      - name
      - models
      title: ConversationGroupCreate
      description: 'Payload for `POST /v1/scenarios/{scenario_id}/conversation-groups`.


        Creates one group plus one conversation per `models` entry, all owned by the

        caller and sharing the path''s scenario. That scenario carries the parent

        evaluation, which the route derives from it. Every `evaluation_ai_model_id`

        must be a live assignment of that evaluation; repeating one is allowed (e.g.

        the same model at two temperatures). The number of entries may not exceed

        `MAX_CONVERSATION_GROUP_SIZE`.'
      example:
        models:
        - evaluation_ai_model_id: 7c9e6679-7425-40de-944b-e07fc1f90ae7
          title: Direct ask
        - evaluation_ai_model_id: 1b9d6bcd-bbfd-4b2d-9b5d-ab8dfbbd4bed
          parameters:
