    AiModelUpdate:
      properties:
        name:
          anyOf:
          - type: string
            maxLength: 255
            minLength: 1
          - type: 'null'
          title: Name
        description:
          anyOf:
          - type: string
            maxLength: 2000
          - type: 'null'
          title: Description
          description: Admin/owner note; send `null` — or a blank string — to clear it.
        model_alias:
          anyOf:
          - type: string
            maxLength: 128
            minLength: 1
          - type: 'null'
          title: Model Alias
        provider:
          anyOf:
          - $ref: '#/components/schemas/ProviderVendor'
          - type: 'null'
        input_modalities:
          anyOf:
          - items:
              $ref: '#/components/schemas/Modality'
            type: array
          - type: 'null'
          title: Input Modalities
          description: Replaces the declared prompt set wholesale. Must include `text`; deduped and re-sorted.
        output_modalities:
          anyOf:
          - items:
              $ref: '#/components/schemas/Modality'
            type: array
            minItems: 1
          - type: 'null'
          title: Output Modalities
          description: Replaces the declared reply set wholesale. Must be non-empty; deduped and re-sorted.
        provider_model_id:
          anyOf:
          - type: string
            maxLength: 255
            minLength: 1
          - type: 'null'
          title: Provider Model Id
        endpoint_name:
          anyOf:
          - type: string
            maxLength: 255
          - type: 'null'
          title: Endpoint Name
        inference_endpoint:
          anyOf:
          - type: string
            maxLength: 1024
          - type: 'null'
          title: Inference Endpoint
        icon_file:
          anyOf:
          - type: string
            maxLength: 255
          - type: 'null'
          title: Icon File
        labels:
          anyOf:
          - items:
              type: string
              maxLength: 64
            type: array
            maxItems: 20
          - type: 'null'
          title: Labels
          description: Replaces the label set wholesale. Normalised like on create; `[]` clears every label.
        parameters:
          anyOf:
          - $ref: '#/components/schemas/InferenceParams'
          - type: 'null'
        extras:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Extras
        is_disabled:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Is Disabled
        warmup_enabled:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Warmup Enabled
        advanced_params_disabled:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Advanced Params Disabled
        inactivity_alert_hours:
          anyOf:
          - type: integer
            maximum: 8760.0
            minimum: 1.0
          - type: 'null'
          title: Inactivity Alert Hours
          description: Quiet hours (1-8760) before admins are alerted; send `null` to stop alerting. Acts only on a `warmup_enabled`
            model.
      type: object
      title: AiModelUpdate
      description: 'Payload accepted by `PATCH /v1/ai-models/{id}`.


        Omitted fields stay; `None` clears the nullable columns

        (`description`, `endpoint_name`, `inference_endpoint`, `icon_file`) — and a blank

        `description` normalises to `None`, so it clears too — except that a patch

        touching `provider` or `inference_endpoint` must leave a `generic` row with

        a URL, so clearing it there is a 400. A supplied `inference_endpoint` must

        be an absolute http(s) URL (422); an untouched one is never re-validated,

        so a row predating that rule stays editable. Explicit `null` is rejected on the

        others — they back NOT NULL DB columns. The API key is not on this surface

        — rotate or clear it via the dedicated `…/api-key` endpoints so the

        operation stays auditable on its own. `inactivity_alert_hours` with

        `warmup_enabled` off is representable and deliberately inert — the value

        survives toggling warm-up.'
      example:
        is_disabled: true
        name: Claude 3.5 Sonnet (deprecated)
    AnnotationCreate:
