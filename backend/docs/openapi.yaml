  /api/v1/evaluation-groups/{group_id}/invitations/bulk:
    post:
      tags:
      - evaluation-groups
      summary: Invite users to a group
      description: Invite up to 100 users to the group in one request — the only group-invite path, a single invitee is a
        one-row request. Each row is an email with one or more in-group roles pre-assigned; the roles are assigned on the
        group immediately, and a row targeting an active account reports `outcome=assigned` while a new or onboarding one
        reports `outcome=invited`. Always returns 200 OK when the envelope is well-formed — per-row failures (`400` for unknown
        / non-assignable roles, `409` for deactivated users, a concurrent signup race, or a re-invite that would drop the
        group's last `owner`) land inside `results[].error`. Re-inviting an existing member reconciles their role set; the
        same email in more than one row is rejected (`422`), like a duplicate `row_key`. Notification emails are dispatched
        best-effort after the request has committed — a row can report `ok` even if its email could not be queued. `dry_run=true`
        previews the full processing path and rolls back instead of committing — no emails are sent.
      operationId: bulk_create_group_invitations_endpoint_api_v1_evaluation_groups__group_id__invitations_bulk_post
      parameters:
      - name: group_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Group Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupInvitationBulkRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkResponse_GroupInvitationResponse_'
        '422':
