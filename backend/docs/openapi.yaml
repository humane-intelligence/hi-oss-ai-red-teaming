  /api/v1/chat/stream:
    post:
      tags:
      - chat
      summary: Stream a chat completion
      description: 'Stream a model reply token-by-token over Server-Sent Events.


        Resolution failures (unknown alias, a model that cannot answer in text, undecryptable credential)

        and the auth gate surface as `application/problem+json` **before** the stream

        starts. A provider failure *after* the first byte arrives as an `error` event in

        the body — the HTTP status is already `200` by then.


        ### Events

        - `delta` — `{"content": "..."}`, one per slice

        - `done` — `{"finish_reason": ..., "usage": ...}`, terminal

        - `error` — RFC 7807 shape plus `retryable: bool`


        Each event carries a monotonic `id:`. Events never include model or provider

        identity.'
      operationId: stream_chat_api_v1_chat_stream_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatStreamRequest'
        required: true
      responses:
        '200':
          description: 'Server-sent event stream: `delta` events, a terminal `done`, or an `error` event.'
          content:
            text/event-stream:
              schema:
                type: string
        '422':
          description: Request failed validation.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: Unexpected server error.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '400':
          description: Model cannot serve this request (it cannot answer in text, or an image went to a model that does not
            accept image input).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Missing or invalid bearer token.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Caller lacks the conversations:participate permission.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Model alias does not exist.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '502':
          description: Stored credential could not be decrypted.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
