components:
  schemas:
    ActivityMetrics:
      properties:
        conversations:
          type: integer
          title: Conversations
          description: Live conversations in scope.
        messages:
          type: integer
          title: Messages
          description: Live messages across those conversations.
      type: object
      required:
      - conversations
      - messages
      title: ActivityMetrics
      description: Engagement volume — conversations started and messages exchanged.
    AiModelApiKeyBulkItem:
      properties:
        name:
          type: string
          maxLength: 255
          minLength: 1
          title: Name
          description: Display name of the target model — its identity key.
        api_key:
          type: string
          minLength: 1
          format: password
          title: Api Key
          description: Plaintext credential — encrypted before persisting.
          writeOnly: true
      type: object
      required:
      - name
      - api_key
      title: AiModelApiKeyBulkItem
      description: 'One row of a bulk API-key upload.


        Targets its model by `name` — its unique business key — rather than by id,

        so keys can be uploaded from the same config that named the models with no

        server-assigned ids to thread back.'
      example:
        api_key: sk-ant-…
        name: Claude 3.5 Sonnet
    AiModelApiKeyBulkRequest:
      properties:
        rows:
          items:
            $ref: '#/components/schemas/BulkRow_AiModelApiKeyBulkItem_'
          type: array
          minItems: 1
          title: Rows
          description: At least one row is required.
        dry_run:
          type: boolean
          title: Dry Run
          description: If true, the request is processed and rolled back instead of committed.
          default: false
      type: object
      required:
      - rows
      title: AiModelApiKeyBulkRequest
      description: 'Bulk envelope that additionally rejects duplicate targets within the batch.


        Two rows for one `name` would set the same model''s key twice — the later

        row silently wins. Reject upfront (422), mirroring `AiModelBulkRequest`''s

        duplicate guard.'
    AiModelApiKeyUpdate:
      properties:
        api_key:
          type: string
          minLength: 1
          format: password
          title: Api Key
          description: Plaintext credential — encrypted before persisting.
          writeOnly: true
      type: object
      required:
      - api_key
      title: AiModelApiKeyUpdate
      description: Payload accepted by `PUT /v1/ai-models/{id}/api-key`.
      example:
        api_key: sk-ant-…
    AiModelBulkRequest:
      properties:
        rows:
          items:
            $ref: '#/components/schemas/BulkRow_AiModelCreate_'
          type: array
          minItems: 1
          title: Rows
          description: At least one row is required.
        dry_run:
          type: boolean
          title: Dry Run
          description: If true, the request is processed and rolled back instead of committed.
          default: false
      type: object
      required:
      - rows
      title: AiModelBulkRequest
      description: 'Bulk envelope that additionally rejects duplicate identities within the batch.


        Two rows sharing a `name` or a `model_alias` can never both commit — the

        second hits the live-row unique constraint and fails per-row. Rejecting the

        collision upfront (422) is clearer than surfacing it as a mid-batch 409, and

        mirrors `GroupInvitationBulkRequest`''s duplicate-email guard.'
    AiModelCreate:
      properties:
        name:
          type: string
          maxLength: 255
          minLength: 1
          title: Name
          description: Display name. Must be unique among live rows.
        description:
          anyOf:
          - type: string
            maxLength: 2000
          - type: 'null'
          title: Description
          description: Admin-authored note — which engagement the model belongs to, restrictions on reuse. Surrounding whitespace
            is stripped and a blank note is stored as `null`. Readable wherever `models:read` is held, globally or through
            an in-group role; absent from the per-evaluation model list a red-teamer reads.
        model_alias:
          type: string
          maxLength: 128
          minLength: 1
          title: Model Alias
          description: Stable slug used by gateway dispatch. Must be unique among live rows.
        provider:
          $ref: '#/components/schemas/ProviderVendor'
          description: Vendor whose API this row routes to.
        input_modalities:
          items:
