        in: query
        required: false
        schema:
          anyOf:
          - type: boolean
          - type: 'null'
          description: Narrow to roles assignable as in-group (object) roles. Omit for the whole catalog.
          title: Is Object Assignable
        description: Narrow to roles assignable as in-group (object) roles. Omit for the whole catalog.
