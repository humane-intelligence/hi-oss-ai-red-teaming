      summary: List labels in use
      description: 'Every distinct label carried by a live model, sorted case-insensitively — the suggestion set for the label
        picker. There is no separate label catalog: a label exists exactly as long as some model wears it. Disabled models
        count, so disabling the last user of a label does not retire it — a deliberate divergence from the list route, where
        surfacing disabled rows needs `models:update`: a retired label is re-typed by hand, which is how near-duplicate spellings
        get in. Authorised by **global** `models:read` alone, with no `for_group` escape hatch, because the only caller is
