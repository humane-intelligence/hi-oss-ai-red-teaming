            maxLength: 255
          - type: 'null'
          title: Endpoint Name
          description: Provider-side endpoint admin name.
        inference_endpoint:
          anyOf:
          - type: string
            maxLength: 1024
          - type: 'null'
          title: Inference Endpoint
          description: Custom inference URL, absolute and http(s) — surrounding whitespace is stripped. Required when `provider`
            is `generic`, which has no vendor-hosted base.
        icon_file:
          anyOf:
          - type: string
            maxLength: 255
          - type: 'null'
          title: Icon File
          description: UI hint.
        labels:
          items:
            type: string
            maxLength: 64
          type: array
          maxItems: 20
          title: Labels
          description: Free-form operator annotations, at most 20 distinct and 64 characters each. Whitespace is collapsed,
            case-only duplicates dropped, the set stored sorted.
        parameters:
          $ref: '#/components/schemas/InferenceParams'
          description: Default inference parameters.
        extras:
          additionalProperties: true
          type: object
          title: Extras
          description: Provider-specific blob.
        is_disabled:
          type: boolean
          title: Is Disabled
          description: Set true to block the gateway from dispatching to this row.
          default: false
        warmup_enabled:
          type: boolean
          title: Warmup Enabled
          description: Set true for a scale-to-zero endpoint so clients warm it before the first message.
          default: false
        advanced_params_disabled:
          type: boolean
          title: Advanced Params Disabled
          description: 'Set true to opt this model out of the inference-params cascade: knobs set here or at any layer below
            are retained but never sent to the provider, and the console stops offering them.'
          default: false
        inactivity_alert_hours:
          anyOf:
          - type: integer
            maximum: 8760.0
            minimum: 1.0
          - type: 'null'
          title: Inactivity Alert Hours
          description: 'Alert admins once no message has been dispatched to this model for this many hours (1-8760) — warmups
            do not count, so an endpoint kept warm by conversation opens still alerts. Applies only when `warmup_enabled`
            is set: an always-on endpoint costs nothing while idle, so it is never swept. Omit or `null` for no alert.'
        api_key:
          anyOf:
          - type: string
            format: password
            writeOnly: true
          - type: 'null'
          title: Api Key
          description: Plaintext credential — encrypted before persisting.
      type: object
      required:
      - name
      - model_alias
      - provider
      - provider_model_id
      title: AiModelCreate
      description: 'Payload accepted by `POST /v1/ai-models`.


        `api_key` is optional — rows without one are usable for providers that

        authenticate via environment-bound credentials (e.g. `aws_bedrock` with

        instance roles) or are stubbed for later configuration.'
      example:
        advanced_params_disabled: false
        api_key: sk-ant-…
        description: Client Acme only — do not assign to other engagements.
        extras: {}
        icon_file: anthropic.svg
        inactivity_alert_hours: 48
