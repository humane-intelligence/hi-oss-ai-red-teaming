  /api/v1/annotation-labels:
    get:
      tags:
      - annotation-labels
      summary: List annotation labels
      description: 'The labels this caller may pick from, ordered by display name: the shared curated vocabulary, **plus**
        the caller''s own labels (created by naming one while annotating), plus — with `conversation_id` — those already used
        in that conversation, whoever typed them. Each entry carries `is_custom` to tell the two kinds apart. Another annotator''s
        labels are never listed wholesale; only the ones in a conversation you can see. **One entry per wording**, since each
        annotator holds their own row for a spelling they have used: where several rows share a name, the curated one wins,
        then yours, then a colleague''s — so `total` counts wordings on offer, not rows in the table. Read-only: the curated
        entries are code-owned and reconciled on deploy, and a typed one is created as a side effect of annotating, so there
        is no create or edit route here. Gated on `annotations:read` rather than being open to any authenticated caller (as
        the licence pick-list is), so the vocabulary stays out of reach of a role deliberately kept clear of the whole annotation
        surface — the red teamer. A role that reads annotations without authoring them, such as the owner, does hold the key.
        Paginated like every list here, so a picker wanting the whole vocabulary should request `limit=100` and keep paging
        while `total` exceeds `offset + limit`. There is no search parameter yet: the curated set is a handful of entries,
        but a caller''s own labels accumulate, so paging is what a long list needs until one lands. An empty **first** page
        means the deploy''s sync step has not run; nothing else depends on these rows, so the picker simply has nothing to
        suggest.'
      operationId: list_annotation_labels_endpoint_api_v1_annotation_labels_get
      parameters:
      - name: conversation_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          description: Also offer labels already used in this conversation, whoever typed them — so annotators on one transcript
            converge on a spelling instead of inventing parallel ones.
          title: Conversation Id
        description: Also offer labels already used in this conversation, whoever typed them — so annotators on one transcript
          converge on a spelling instead of inventing parallel ones.
      - name: limit
