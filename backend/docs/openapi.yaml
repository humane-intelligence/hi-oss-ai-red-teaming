        conversations, and reviews. `tokens` reports the group''s model spend; `tokens_by_model` breaks it down per registry
        model and is served only to a full-access `evaluation_groups:view_metrics` caller, or when no evaluation in the group
        masks model names — a row correlates one model''s cost across evaluations, which per-evaluation masking withholds.
