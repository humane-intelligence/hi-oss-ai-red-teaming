openapi: 3.1.0
info:
  title: AI red teaming backend
  summary: 'Backend API for AI red-teaming workflows: conversations, evaluations, notes, analytics.'
  description: "\nBackend service for AI red-teaming workflows.\n\n## Conventions\n\n- **Versioning.** Domain endpoints live\
    \ under `/api/v1/...`. Health probes\n  (`/health`, `/ready`) are top-level and unversioned.\n- **Errors.** Every non-2xx\
    \ response uses the RFC 7807 *Problem Details*\n  envelope and is served with `Content-Type: application/problem+json`.\n\
    \  See the `Problem` schema below.\n- **Pagination.** List endpoints take `limit` (1..100, default 20) and\n  `offset`\
    \ (>=0, default 0) query parameters and return a `Page` wrapper\n  with `items`, `total`, `limit`, and `offset`.\n- **Content\
    \ type.** Requests and successful responses use `application/json`.\n- **Terms of service.** Once a version is published,\
    \ every authenticated\n  endpoint answers `403` with\n  `type: urn:redteam:error:terms-acceptance-required` until the\
    \ caller has\n  accepted the current one. `GET /api/v1/auth/me` reports what is owed\n  (`terms_acceptance_required`),\
    \ `GET /api/v1/terms/current` and\n  `GET /api/v1/terms/{terms_id}` serve the text, and\n  `POST /api/v1/auth/me/terms`\
    \ records the acceptance — those four keep\n  answering, so the state is always clearable. Public endpoints are outside\n\
    \  the gate entirely: they never resolve the dependency that enforces it,\n  except where one authorises on identity rather\
    \ than on a key: minting and\n  fetching a signed URL for a *private* image both bind it to the caller, and\n  both answer\
    \ the same refusal. The refusal is cross-cutting and therefore documented here rather\n  than on each endpoint.\n\n##\
    \ Errors\n\nA typical error response looks like:\n\n```json\n{\n  \"type\": \"about:blank\",\n  \"title\": \"Not Found\"\
    ,\n  \"status\": 404,\n  \"detail\": \"User 7f3a not found.\",\n  \"instance\": \"/api/v1/auth/users/7f3a\"\n}\n```\n\n\
    Validation errors (422) additionally include an `errors` array with one\nentry per offending field, matching Pydantic's\
    \ `ValidationError.errors()`\nshape (`loc`, `msg`, `type`).\n"
  contact:
    name: AI Red Teaming Backend
    url: https://github.com/humane-intelligence/hi-oss-ai-red-teaming
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  version: dev
paths:
  /health:
    get:
      tags:
      - health
      summary: Healthcheck
      description: 'Liveness probe.


        Always returns 200 as long as the process can serve a request. Does not

        touch any dependency — use `/ready` for that.'
      operationId: healthcheck_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
                title: Response Healthcheck Health Get
  /ready:
    get:
      tags:
      - health
      summary: Readiness
      description: "Readiness probe — checks every dependency required to serve traffic.\n\nRuns each dependency check **concurrently**\
        \ with a short per-check\ntimeout, so an unhealthy backend cannot block the response.\n\n### Status codes\n\n* **200\
        \ OK** — every dependency answered successfully.\n* **503 Service Unavailable** — at least one dependency failed;\
        \ inspect\n  the `checks` map for the offending key and its `error` string.\n\nSuitable as a Kubernetes `readinessProbe`.\
        \ Use `/health` for liveness —\nthis endpoint will fail fast on a dependency outage and should not be\ntreated as\
        \ a liveness signal."
      operationId: readiness_ready_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
  /version:
    get:
      tags:
      - health
      summary: Version
      description: 'Deployed commit SHA and environment.


        Public (no auth) — backs the frontend version readout, including the

        pre-login page.'
      operationId: version_version_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionResponse'
  /api/v1/auth/login:
    post:
      tags:
      - auth
      summary: Log in with email and password
      description: Verify credentials and mint a bearer token pair. `provider` claim is `"local"`.
      operationId: login_api_v1_auth_login_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '422':
          description: Request failed validation.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: Unexpected server error.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Invalid email or password.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/auth/refresh:
    post:
      tags:
      - auth
      summary: Refresh an access token
      description: Exchange a valid refresh token for a new access + refresh token pair.
      operationId: refresh_api_v1_auth_refresh_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '422':
          description: Request failed validation.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: Unexpected server error.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Invalid or expired refresh token.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: Session store unavailable; please retry.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/auth/oidc/providers:
    get:
      tags:
      - auth
      - oidc
      summary: List configured OIDC providers
      description: Names of configured OIDC providers — clients use these to build a login UI.
      operationId: list_providers_api_v1_auth_oidc_providers_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  type: string
                type: array
                title: Response List Providers Api V1 Auth Oidc Providers Get
        '422':
          description: Request failed validation.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: Unexpected server error.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/auth/oidc/{provider}/login:
    get:
      tags:
      - auth
      - oidc
      summary: Begin OIDC login
      description: Redirect to the IdP's authorize endpoint. authlib stashes `state` + `nonce` on the short-lived `oidc_state`
        cookie so the callback can validate the round-trip; that cookie is unrelated to the app's Bearer session. A network
        failure reaching the IdP redirects to the SPA with `#error=oauth_error` instead of a 500, same as the callback.
      operationId: login_api_v1_auth_oidc__provider__login_get
      parameters:
      - name: provider
        in: path
        required: true
        schema:
          type: string
          title: Provider
      responses:
        '302':
          description: Successful Response
        '422':
          description: Request failed validation.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: Unexpected server error.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Unknown OIDC provider.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/auth/oidc/{provider}/callback:
    get:
      tags:
      - auth
      - oidc
      summary: Complete OIDC login
      description: Exchange the IdP code for tokens, resolve (or provision) the local user, and redirect the browser to the
        SPA with the bearer token pair in the URL fragment (`#access_token=…&refresh_token=…&expires_in=…`). A first login
        for an unknown IdP identity links it to the account owning the claimed email, or creates one. Every in-flow failure
        redirects to the same SPA route with `#error=<code>` instead — the browser lands here by navigation, so a JSON error
        body would strand the user on a dead page.
      operationId: auth_callback_api_v1_auth_oidc__provider__callback_get
      parameters:
      - name: provider
        in: path
        required: true
        schema:
          type: string
          title: Provider
      responses:
        '302':
          description: Successful Response
        '422':
          description: Request failed validation.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: Unexpected server error.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Unknown OIDC provider.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/auth/users:
    get:
      tags:
      - auth
      - users
      summary: List users
      description: Return a paginated slice of users with optional filters and ordering. `order_by` accepts a column name;
        prefix with `-` for descending order. Pass `deleted=true` (requires `users:delete`) for the tombstones inside the
        restore window — the set `POST /{user_id}/restore` accepts, subject to its elevation guard.
      operationId: list_users_endpoint_api_v1_auth_users_get
      parameters:
      - name: order_by
        in: query
        required: false
        schema:
          enum:
          - created_at
          - -created_at
          - updated_at
          - -updated_at
          - email
          - -email
          - status
          - -status
          - first_name
          - -first_name
          - last_name
          - -last_name
          - deleted_at
          - -deleted_at
          type: string
          description: Column to order by; prefix with `-` for descending.
          default: created_at
          title: Order By
        description: Column to order by; prefix with `-` for descending.
      - name: deleted
        in: query
        required: false
        schema:
          type: boolean
          description: List soft-deleted items instead of live ones. Bounded by the platform restore window; requires the
            same permission as deleting, and shows every actor's deletes — there is no per-deleter narrowing. Ordering is
            unchanged by this flag — pass `order_by=-deleted_at` for most-recently-deleted first.
          default: false
          title: Deleted
        description: List soft-deleted items instead of live ones. Bounded by the platform restore window; requires the same
          permission as deleting, and shows every actor's deletes — there is no per-deleter narrowing. Ordering is unchanged
          by this flag — pass `order_by=-deleted_at` for most-recently-deleted first.
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 20
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Offset
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/UserStatus'
          - type: 'null'
          title: Status
      - name: email
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 320
          - type: 'null'
          title: Email
      - name: first_name
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 255
          - type: 'null'
          title: First Name
      - name: last_name
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 255
          - type: 'null'
          title: Last Name
      - name: role_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Role Id
      - name: search
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 320
          - type: 'null'
          title: Search
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page_UserResponse_'
        '422':
          description: Request failed validation.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: Unexpected server error.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Missing or invalid bearer token.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Caller lacks the required permission.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/auth/users/{user_id}:
    get:
      tags:
      - auth
      - users
      summary: Get user
      description: Fetch one user by id.
      operationId: get_user_endpoint_api_v1_auth_users__user_id__get
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: User Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '422':
          description: Request failed validation.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: Unexpected server error.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Missing or invalid bearer token.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Caller lacks the required permission.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: User does not exist.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
    patch:
      tags:
      - auth
      - users
      summary: Update user
      description: Partially update a user. Omitted fields are left unchanged. Supplying `role_ids` replaces the full role
        set and must contain at least one role id.
      operationId: update_user_endpoint_api_v1_auth_users__user_id__patch
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: User Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '422':
          description: Request failed validation.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: Unexpected server error.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '400':
          description: One or more referenced roles do not exist.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Missing or invalid bearer token.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Caller lacks the required permission.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: User does not exist.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
    delete:
      tags:
      - auth
      - users
      summary: Delete user
      description: Soft-delete a user (sets `deleted_at`).
      operationId: delete_user_endpoint_api_v1_auth_users__user_id__delete
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: User Id
      responses:
        '204':
          description: Successful Response
        '422':
          description: Request failed validation.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: Unexpected server error.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Missing or invalid bearer token.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Caller lacks the required permission.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: User does not exist.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: The user is the sole owner of an object; reassign first.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/auth/users/{user_id}/restore:
    post:
      tags:
      - auth
      - users
      summary: Restore a user
      description: 'Clear a soft-deleted account''s `deleted_at`, returning it with its roles, status and organization membership
        as the delete left them. Restorable for a fixed window after the delete (set per deployment). Gated exactly like the
        delete, elevation guard included: restoring an admin requires `users:manage_admin`, since the restore hands every
        role on the tombstone back at once. External login links are **not** revived — the next external login re-links them.
        Not a re-login: any unexpired token minted before the delete works again, so force-logout the account first if that
        is not wanted.'
      operationId: restore_user_endpoint_api_v1_auth_users__user_id__restore_post
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: User Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '422':
          description: Request failed validation.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: Unexpected server error.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Missing or invalid bearer token.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Caller lacks the required permission.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: 'No restorable user with this id: never deleted, or deleted longer than the restore window ago.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: A live account already holds the tombstone's email, or none of its roles is live and active any more.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/auth/users/force-logout:
    post:
      tags:
      - auth
      - users
      summary: Force-logout users in bulk
      description: Revoke all active sessions of up to `BULK_MAX_ROWS` users in one request. Always returns 200 OK when the
        envelope is well-formed — a `404` for an unknown user id lands inside `results[].error`. `dry_run=true` previews the
        full path and revokes nothing.
      operationId: bulk_force_logout_endpoint_api_v1_auth_users_force_logout_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkRequest_ForceLogoutTarget_'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkResponse_ForceLogoutTarget_'
        '422':
          description: Request failed validation.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: Unexpected server error.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Missing or invalid bearer token.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Caller lacks the required permission.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
