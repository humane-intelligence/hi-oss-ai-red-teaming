      - conversations
      summary: Start a conversation
      description: Start a fresh, empty conversation against a model assigned to the scenario's evaluation. The scenario comes
        from the path and carries that evaluation; the owner is the authenticated caller. The model assignment must belong
        to the evaluation, and the scenario must be the target group's scenario (a group's conversations all share it). Optional
        `tags` are free-form key/value pairs stored on the conversation and folded into the model's prompt as context, minus
        any the evaluation's tagging policy no longer allows — those stay on the row but are not sent. When the evaluation
        restricts tags, every key must be in its allowed set; when it disables tagging, every key is rejected. The `Location`
        header points at the conversation's read route, which stays nested under the evaluation.
      operationId: create_conversation_endpoint_api_v1_scenarios__scenario_id__conversations_post
      parameters:
      - name: scenario_id
