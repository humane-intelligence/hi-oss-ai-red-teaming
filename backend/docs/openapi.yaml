        and can no longer be downloaded. The manual counterpart to the TTL reaper — revoke an export generated by mistake,
        or after sharing, before its window lapses. The requester deletes their own jobs; an `evaluation_groups:manage` admin
        may also delete any requester''s export (housekeeping after a departed red-teamer). Only `ready`/`failed` jobs are
        deletable (a `409` otherwise); a still-generating job would race the worker''s finalize and orphan its file.'
