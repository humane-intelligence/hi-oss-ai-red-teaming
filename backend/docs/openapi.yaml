        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Conversation Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserMessageIn'
      responses:
        '200':
          description: 'Server-sent event stream: `delta` events, a terminal `done`, or an `error` event.'
