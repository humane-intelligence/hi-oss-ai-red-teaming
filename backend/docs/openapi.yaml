          description: Stable catalog key — unchanged when the display name is reworded; null for a label an annotator named
            rather than one from the curated vocabulary.
        name:
          type: string
          title: Name
          description: Display wording, for the label picker.
        is_custom:
          type: boolean
          title: Is Custom
          description: 'True for a label scoped to one annotator — theirs, plus visible in the conversations it is used in;
            false for the shared curated vocabulary. It marks *user-scoped*, not *typed*: naming a curated wording resolves
            to the curated row, which comes back false.'
