            text/event-stream:
              schema:
                type: string
        '422':
          description: Request failed validation.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: Unexpected server error.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '400':
          description: Model cannot serve this request (it cannot answer in text, or an image went to a model that does not
            accept image input), an image_keys entry is unknown/not the caller's own private upload, or this request's `tags`
            carry a key the evaluation disallows (tagging disabled, or outside its restricted tag schema).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
