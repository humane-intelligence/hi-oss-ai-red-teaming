          description: Group-wide token spend — equal to the sum of the per-evaluation `tokens.total_tokens`.
        tokens_by_model:
          items:
            $ref: '#/components/schemas/GroupTokensByModelMetrics'
          type: array
          title: Tokens By Model
          description: 'Group-wide spend per registry model, descending; zero-inclusive over the models assigned to the group''s
            live evaluations, so an assigned-but-unused model reads as unused rather than missing. **Empty** unless the caller
            holds full `evaluation_groups:view_metrics` access or no evaluation in the group masks model names: a row correlates
            one model''s cost across evaluations, which is precisely what per-evaluation masking withholds, so one masking
            evaluation withholds the whole list. `tokens` is unaffected — only the attribution is withheld, never the total.'
        tokens_by_model_withheld:
          type: boolean
          title: Tokens By Model Withheld
          description: 'Whether `tokens_by_model` is empty *because* the attribution is withheld, rather than because no model
            is assigned. Render the two differently: withheld means the spend exists but cannot be attributed, so a per-model
            chart should say so instead of reading as zero. Never derive this from `models_assigned` sums.'
        evaluations:
          items:
            $ref: '#/components/schemas/EvaluationMetrics'
          type: array
          title: Evaluations
          description: Per-evaluation breakdown, in the group's evaluation order.
        submissions_by_day:
          items:
            $ref: '#/components/schemas/DailySubmissionPoint'
          type: array
          title: Submissions By Day
          description: 'Group-wide submission timeline, oldest first: one entry per UTC day of the window, zero-filled. The
            window runs from the earlier of the group''s start date and its first submission to the later of its last submission
            and today (or the group''s end date, once that has passed); a start date more than a year before that end contributes
            only the last year of empty lead-in, but no submission is ever left outside. So the series and `submissions.total`
            agree, up to a submission committed between the two reads that backs them. Empty while there is nothing to plot:
            a group with neither a start date nor a submission, or one whose start date is still in the future. On a `personal`
            read the window is derived from the caller''s own submissions, so two members can see different spans. Each evaluation''s
            own sparse `submissions_by_active_day` plots against this axis.'
      type: object
      required:
      - scope
      - group_id
      - members
      - submissions
      - reviews
      - activity
      - tokens
      - tokens_by_model
      - tokens_by_model_withheld
      - evaluations
      - submissions_by_day
