      required:
      - id
      - name
      - is_custom
      title: AnnotationLabelResponse
      description: One label an annotation can carry — curated, or one an annotator typed.
      example:
        id: 5f1c7a90-8d3b-4e2a-9c11-6b7d0e4f2a83
        is_custom: false
        key: jailbreak
        name: Jailbreak
