      - submissions
      - exploited_submissions
      title: DailySubmissionPoint
      description: One UTC calendar day of an event's submission timeline.
    DataLicenseResponse:
      properties:
        id:
          type: string
          format: uuid
          title: Id
          description: Stable id — the value stored on evaluations/groups and the platform default.
        spdx_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Spdx Id
          description: SPDX id where the licence publishes one; `null` for user-authored licences and `No license`.
        name:
          type: string
          title: Name
          description: Human-readable licence name / title.
        version:
          anyOf:
          - type: string
          - type: 'null'
          title: Version
          description: Licence version, e.g. `4.0`.
        short_description:
          type: string
          title: Short Description
          description: One-line gist of the licence terms.
        reference_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Reference Url
          description: Canonical URL of the full licence text, if any.
        is_curated:
          type: boolean
          title: Is Curated
          description: A platform-shipped licence (not editable by an owner).
        is_default:
          type: boolean
          title: Is Default
          description: The current platform default data licence.
          default: false
        has_content:
          type: boolean
          title: Has Content
          description: Whether this licence carries its full text on the platform (fetch it via `GET /licenses/{id}`).
        is_no_license:
          type: boolean
          title: Is No License
          description: The catalog's `No license` entry — data under it carries no licence at all, and a group pointing at
            it blocks the inheritance its evaluations and conversations would otherwise follow. Answered by the server so
            a client never has to infer the row.
        text_managed_in_code:
          type: boolean
          title: Text Managed In Code
          description: The platform ships this licence's text in code, so `PATCH /licenses/{id}` refuses to change it (403)
            and a resync would revert it anyway. `false` for every user-authored licence and for a curated one the catalog
            ships no text for — the one row kind whose `content` a `licenses:manage` holder may fill in.
        protects_conversation_data:
          type: boolean
          title: Protects Conversation Data
          description: 'The licence forbids redistributing raw conversations: message text written under it is stored encrypted
            at rest — conversation titles, tags and attached images are not. A conversation takes that decision once, when
            it is created, so turning the flag on later covers conversations started from then on and nothing already running,
            including messages added to those later. Curated licences carry the catalog''s value and reject a change here.'
        created_by_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Created By Id
          description: Author of a user-created licence; `null` for curated.
        deleted_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Deleted At
          description: UTC timestamp of the soft-delete; null on a live row.
        deleted_by_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Deleted By Id
          description: User who deleted the licence; null on a live row, or when the delete was system-initiated.
        content:
          type: string
          title: Content
          description: Full legal text of the licence.
      type: object
      required:
      - id
      - spdx_id
      - name
      - version
      - short_description
      - reference_url
      - is_curated
      - has_content
      - is_no_license
      - text_managed_in_code
      - protects_conversation_data
      - created_by_id
      - content
      title: DataLicenseResponse
      description: A data licence with its full legal text — the detail view.
      example:
        has_content: false
        id: 7c9e6679-7425-40de-944b-e07fc1f90ae7
        is_curated: true
        is_default: true
        is_no_license: false
        name: Creative Commons Attribution 4.0 International
        protects_conversation_data: false
        reference_url: https://creativecommons.org/licenses/by/4.0/legalcode
        short_description: Share and adapt for any purpose, with attribution.
        spdx_id: CC-BY-4.0
        text_managed_in_code: false
        version: '4.0'
