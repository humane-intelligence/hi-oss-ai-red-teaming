        Build via `EvaluationResponse.from_model(evaluation, effective_license=...)`. The caller must

        have eager-loaded the live `models` relationship and each assignment''s `ai_model`, since

        `from_model` projects them without further DB access, and pass the already-resolved effective

        data license (evaluation override → group override → platform default; see

        `resolve_effective_licenses`) — the projection can''t resolve the cascade itself without the

        parent group loaded.'
      example:
        created_at: '2026-01-01T12:00:00Z'
        created_by_id: a1b2c3d4-1111-2222-3333-444455556666
        description: Coordinate jailbreak attempts against the masked fleet.
        effective_license:
          has_content: false
          id: 7c9e6679-7425-40de-944b-e07fc1f90ae7
          is_curated: true
          is_default: true
          is_no_license: false
          name: Creative Commons Attribution 4.0 International
          protects_conversation_data: false
          reference_url: https://creativecommons.org/licenses/by/4.0/legalcode
          short_description: Share and adapt for any purpose, with attribution.
          spdx_id: CC-BY-4.0
          text_managed_in_code: false
          version: '4.0'
        evaluation_group_id: 1b9d6bcd-bbfd-4b2d-9b5d-ab8dfbbd4bed
        id: f3a1d2b4-1c2e-4f56-8a7b-9c0d1e2f3a4b
        mask_models_enabled: true
        models:
        - assignment_id: 7c9e6679-7425-40de-944b-e07fc1f90ae7
          input_modalities:
          - text
          name: Model A
          warmup_enabled: true
        status: draft
        title: Prompt-injection gauntlet
        updated_at: '2026-01-02T09:30:00Z'
    EvaluationStatus:
      type: string
      enum:
      - new
      - draft
      - under_review
      - rejected
      - approved
      - published
      - completed
      title: EvaluationStatus
      description: 'Lifecycle state of a single `Evaluation`.


        One value per box on the engagement state diagram; the combined boxes map to

        a single value (`In Progress / Draft` → `draft`, `Closed / Completed` →

        `completed`). Distinct from `PublicationStatus` (used by `EvaluationGroup`):

        the two objects have different lifecycles and naming. The set is closed —

        adding a state requires a migration (`ALTER TYPE ... ADD VALUE`).


        Only the `under_review → approved` / `under_review → rejected` transitions

        are enforced today (admin approval); the rest of the graph lands with the

        owner submit/publish flows.'
    EvaluationTagKeyCreate:
      properties:
        key:
          type: string
          pattern: ^(?:[A-Za-z0-9_.-]{1,64})$
          title: Key
          description: Allowed tag key (letters, digits, `_.-`; ≤64 chars, not dots alone).
      type: object
      required:
      - key
      title: EvaluationTagKeyCreate
      description: Payload to allow a conversation-tag key on an evaluation.
      example:
        key: env
    EvaluationTagKeyResponse:
      properties:
        id:
          type: string
          format: uuid
          title: Id
          description: Server-assigned identifier.
        evaluation_id:
          type: string
          format: uuid
          title: Evaluation Id
          description: Evaluation the key is allowed on.
        key:
          type: string
          title: Key
          description: The allowed tag key.
        created_at:
          type: string
          format: date-time
          title: Created At
          description: UTC timestamp the key was added.
      type: object
      required:
      - id
      - evaluation_id
      - key
      - created_at
      title: EvaluationTagKeyResponse
      description: Public view of one allowed conversation-tag key.
      example:
        created_at: '2026-01-01T12:00:00Z'
        evaluation_id: 3f2a0000-0000-0000-0000-000000000000
        id: 7c9e6679-7425-40de-944b-e07fc1f90ae7
        key: env
    EvaluationUpdate:
      properties:
        title:
          anyOf:
          - type: string
            maxLength: 255
            minLength: 1
          - type: 'null'
          title: Title
          description: Human-facing display name.
        description:
          anyOf:
          - type: string
            minLength: 1
          - type: 'null'
          title: Description
          description: Free-text summary; explicit `null` clears it.
        cover_image:
          anyOf:
          - type: string
            maxLength: 1024
          - type: 'null'
          title: Cover Image
          description: Cover image reference; explicit `null` clears it.
        mask_models_enabled:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Mask Models Enabled
          description: Whether assigned model identities are masked on reads.
        tags_enabled:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Tags Enabled
          description: Whether conversations in this evaluation may carry tags at all.
        tags_restricted:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Tags Restricted
          description: When true, restrict conversation tag keys to the evaluation's allowed-key set.
        data_license_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Data License Id
          description: Data-license override (licence id); explicit `null` resets it to inherit (group, else platform).
      type: object
      title: EvaluationUpdate
      description: 'Payload accepted by `PATCH /v1/evaluations/{evaluation_id}`.


        Content-only: omitted fields stay, and `description` / `cover_image` accept

        explicit `null` to clear them. `status`/`rejection_reason` are owned by the

        lifecycle endpoints, and an evaluation cannot be moved between groups, so

        neither is editable here.'
      example:
        title: Prompt-injection gauntlet (v2)
    ExploitPromptCountBucket:
      properties:
        prompt_count:
          type: integer
          title: Prompt Count
          description: Prompts to the first exploit-flagged message (earliest flagged turn index + 1).
        exploit_count:
          type: integer
          title: Exploit Count
          description: Successful exploits that first landed at this prompt count.
        avg_tokens_to_exploit:
          anyOf:
          - type: number
          - type: 'null'
          title: Avg Tokens To Exploit
          description: 'Mean tokens one exploit in this bucket cost to reach, so a shallow break can be compared against a
            deep one rather than against the conversation''s whole spend. Averaged over `exploits_with_tokens`, not over `exploit_count`;
            `null` when no exploit here reported usage — a zero would read as free rather than as unmeasured.


            The unit is a **whole turn**: it sums every billed generation in the turns up to and including the exploiting
            one. So a regenerate *within* the exploiting turn is included even though it came after the break, and a turn
            whose provider reported nothing contributes zero rather than excluding the exploit — an exploit counts as measured
            once any turn in its prefix reported usage, which makes a partly-reported prefix an understatement rather than
            a gap.'
        exploits_with_tokens:
          type: integer
          title: Exploits With Tokens
          description: How many of this bucket's exploits had at least one usage-reporting turn in their prefix, i.e. the
            denominator `avg_tokens_to_exploit` divides by. Below `exploit_count` when a provider reported nothing at all
            for an exploit.
      type: object
      required:
      - prompt_count
      - exploit_count
      - avg_tokens_to_exploit
      - exploits_with_tokens
      title: ExploitPromptCountBucket
      description: 'One point of the exploits-by-prompt-count distribution.


        `prompt_count` is how many prompts it took to reach the first exploit-flagged message in

        a conversation (the earliest flagged turn''s index + 1) — the "effort to break" signal:

        a 1 means a single-shot jailbreak, a larger number a multi-turn coax.'
    ExploitsByModelMetrics:
      properties:
        evaluation_ai_model_id:
          type: string
          format: uuid
          title: Evaluation Ai Model Id
          description: The evaluation's model assignment these exploits were against.
        model_alias:
          anyOf:
          - type: string
          - type: 'null'
          title: Model Alias
          description: The assigned model's alias, or its display mask when the evaluation masks models and the caller is
            not a full-access `view_metrics` holder (owner/admin); `null` when masked with no mask set. Only the owner/admin
            ever sees the real alias under masking.
        exploit_count:
          type: integer
          title: Exploit Count
          description: Successful exploits recorded against this model (0 for a model that held).
      type: object
      required:
      - evaluation_ai_model_id
      - model_alias
      - exploit_count
      title: ExploitsByModelMetrics
      description: Successful exploits attributed to one assigned model (zero-inclusive, like the scenario rows).
    ExportFilters:
      properties:
        created_from:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Created From
          description: Only rows created at/after this UTC timestamp.
        created_to:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Created To
          description: Only rows created at/before this UTC timestamp.
        status:
          anyOf:
          - type: string
          - type: 'null'
          title: Status
          description: Restrict to one status (flags/reviews only); rejected for other templates.
        scenario_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Scenario Id
          description: Restrict to one scenario (where the row references one).
        task_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Task Id
          description: Restrict to one task (flags export only).
        user_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: User Id
          description: Restrict to one user/red-teamer — the row's author (or the reviewer, for the reviews export).
      additionalProperties: false
      type: object
      title: ExportFilters
      description: 'Optional export row filters, each honored only by the templates where the dimension exists.


        Per-template applicability lives on each template''s `CsvExport.supported_filters`: `task_id`

        narrows only the flags export; `status` only flags/reviews; `scenario_id` flags/conversations/

        conversation-groups/transcript/engagement_report; `created_from`/`created_to` and `user_id`

        apply broadly. A dimension the chosen template doesn''t support is **rejected at request time

        (400)**, not silently dropped. `evaluation` is the export scope, not a filter here.'
    ExportFormat:
      type: string
      enum:
      - csv
      - json
      title: ExportFormat
      description: 'Output format a job renders to. Chosen at create (the worker renders those bytes once).


        Persisted as a plain `str` column (like `template`), not a Postgres enum — so adding a

        format is a code change, no `ALTER TYPE` migration. `csv` is the default for back-compat.'
    ExportJobCreate:
      properties:
        template:
          type: string
          title: Template
          description: Template key — see `GET /api/v1/exports`.
        format:
          $ref: '#/components/schemas/ExportFormat'
          description: Output format (`csv` or `json`).
          default: csv
        filters:
          $ref: '#/components/schemas/ExportFilters'
          description: Optional row filters (see `ExportFilters`).
        evaluation_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Evaluation Id
          description: Export a single evaluation.
        evaluation_group_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Evaluation Group Id
          description: Export a whole evaluation group.
        idempotency_key:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Idempotency Key
          description: 'Optional client key that dedups a burst of identical creates (e.g. an impatient double-click): a repeat
            from the same caller returns the already-queued job instead of starting another. Send a fresh key per deliberate
            export.'
      type: object
      required:
      - template
      title: ExportJobCreate
      description: Request to generate an export in the background. Exactly one scope target is set.
    ExportJobResponse:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        template:
          type: string
          title: Template
        format:
          $ref: '#/components/schemas/ExportFormat'
        status:
          $ref: '#/components/schemas/ExportJobStatus'
        evaluation_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Evaluation Id
        evaluation_group_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Evaluation Group Id
        error:
          anyOf:
          - type: string
          - type: 'null'
          title: Error
          description: Failure reason when `status` is `failed`, else null.
        created_at:
          type: string
          format: date-time
          title: Created At
        expires_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Expires At
          description: TTL deadline, set once the job reaches `ready` or `failed` (the reaper sweeps it after); null while
            `pending`/`running`.
      type: object
      required:
      - id
      - template
      - format
      - status
      - evaluation_id
      - evaluation_group_id
      - error
      - created_at
      - expires_at
      title: ExportJobResponse
      description: State of a background export job — polled until `status` reaches `ready`/`failed`.
      example:
        created_at: '2026-07-01T12:00:00Z'
        evaluation_group_id: b2c3d4e5-2222-3333-4444-555566667777
        expires_at: '2026-07-02T12:00:00Z'
        format: csv
        id: a1b2c3d4-1111-2222-3333-444455556666
        status: ready
        template: engagement_report
    ExportJobStatus:
      type: string
      enum:
      - pending
      - running
      - ready
      - failed
      title: ExportJobStatus
      description: 'Lifecycle of a background export job, orthogonal to soft-delete (`deleted_at`).


        A job lands `pending`, a worker flips it to `running`, and it finalises to

        `ready` (file written, downloadable) or `failed` (generation raised — `error`

        carries the reason). The set is closed — adding a value needs a migration

        (`ALTER TYPE ... ADD VALUE`).'
    FlagStatus:
      type: string
      enum:
      - pending
      - approved
      - rejected
      title: FlagStatus
      description: 'Review lifecycle of a `MessageFlag`.


        A flag lands `pending` and is moved to `approved` / `rejected` by the review

        workflow (a separate scope — there is no transition endpoint yet, so today it

        is always `pending`). The set is closed — adding a state requires a migration

        (`ALTER TYPE ... ADD VALUE`).'
    ForceLogoutTarget:
      properties:
        user_id:
          type: string
          format: uuid
          title: User Id
          description: User whose active sessions will be revoked.
      type: object
      required:
      - user_id
      title: ForceLogoutTarget
      description: A user whose active sessions are to be revoked — bulk row and its result.
    GroupInvitationBulkRequest:
      properties:
        rows:
          items:
            $ref: '#/components/schemas/BulkRow_GroupInvitationCreate_'
          type: array
          maxItems: 100
          minItems: 1
          title: Rows
          description: Invitees, at least one and at most 100.
        dry_run:
          type: boolean
          title: Dry Run
          description: If true, the request is processed and rolled back instead of committed.
          default: false
      type: object
      required:
      - rows
      title: GroupInvitationBulkRequest
      description: 'Bulk envelope of the group invite — same row cap and duplicate rule as the platform one.


        Both feed one operator action, so a limit that differed between them would

        surface as the same dialog accepting a CSV here and rejecting it there.'
    GroupInvitationCreate:
      properties:
        email:
          type: string
          format: email
          title: Email
          description: Invitee email. Normalized to lowercase.
