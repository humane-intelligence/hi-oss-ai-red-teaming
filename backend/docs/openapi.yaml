          - type: 'null'
          title: First Name
          description: Given name, if known.
          examples:
          - Ada
        last_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Last Name
          description: Family name, if known.
          examples:
          - Lovelace
        status:
          $ref: '#/components/schemas/UserStatus'
          description: Lifecycle state of the account.
          examples:
          - active
      type: object
      required:
      - id
      - email
      - status
      title: UserRef
      description: Base identity of a member user, embedded in member responses.
    UserResponse:
      properties:
        id:
          type: string
          format: uuid
          title: Id
          description: Server-assigned user identifier.
          examples:
          - f3a1d2b4-1c2e-4f56-8a7b-9c0d1e2f3a4b
        email:
          type: string
          format: email
          title: Email
          description: Primary email address.
          examples:
          - ada@example.com
        first_name:
          anyOf:
          - type: string
          - type: 'null'
          title: First Name
          description: Given name, if known.
          examples:
          - Ada
        last_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Last Name
          description: Family name, if known.
          examples:
          - Lovelace
        status:
          $ref: '#/components/schemas/UserStatus'
          description: Lifecycle state of the account.
          examples:
          - active
        email_verified:
          type: boolean
          title: Email Verified
          description: Whether the email has been verified.
          examples:
          - true
        organization:
          anyOf:
          - $ref: '#/components/schemas/OrganizationBase'
          - type: 'null'
          description: Organization the user belongs to, or null when orgless or the organization has been deleted.
        roles:
          items:
            $ref: '#/components/schemas/RoleSummary'
          type: array
          title: Roles
          description: Roles assigned to this user (identity + label). Every live user has at least one.
        invitation:
          anyOf:
          - $ref: '#/components/schemas/UserInvitationInfo'
          - type: 'null'
          description: Newest **platform** invitation issued for this account, or null when it has none — including an account
            invited only into an evaluation group, whose invitation is object-scoped. A null here therefore does not imply
            the account was never invited; read `status` for that.
        created_at:
          type: string
          format: date-time
          title: Created At
          description: UTC timestamp of creation.
          examples:
          - '2026-01-01T12:00:00Z'
        updated_at:
          type: string
          format: date-time
          title: Updated At
          description: UTC timestamp of the last update.
          examples:
          - '2026-01-02T09:30:00Z'
        deleted_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Deleted At
          description: UTC timestamp of the soft-delete; null unless this row is a tombstone (`deleted=true` listings).
        deleted_by_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Deleted By Id
          description: User who deleted the account; null on a live row, or when the delete predates this field.
      type: object
      required:
      - id
      - email
      - status
      - email_verified
      - created_at
      - updated_at
      title: UserResponse
      description: 'Public view of a `User` row returned by `/v1/auth/users` endpoints.


        `email_verified` is a boolean projection of the underlying

        `User.email_verified_at` timestamp — true iff verification has happened.

        Build instances via `UserResponse.from_user(user)` to keep that

        projection in one place. `roles` requires `user.roles` to be eagerly

        loaded — callers under an async session must pre-load via `selectinload`.'
      example:
        created_at: '2026-01-01T12:00:00Z'
        email: ada@example.com
        email_verified: true
        first_name: Ada
        id: f3a1d2b4-1c2e-4f56-8a7b-9c0d1e2f3a4b
        last_name: Lovelace
        roles:
        - display_name: Admin
          id: a1b2c3d4-1111-2222-3333-444455556666
          name: admin
        status: active
        updated_at: '2026-01-02T09:30:00Z'
    UserStatus:
      type: string
      enum:
      - active
      - pending
      - invited
      - inactive
      title: UserStatus
      description: 'Lifecycle state of a `User` account.


        `invited` is the default for admin-provisioned accounts that haven''t

        completed onboarding yet; `pending` covers self-signup before email

        verification; `active` is a usable account; `inactive` is a deactivated

        one (distinct from soft-deleted, which uses `BaseModel.deleted_at`).'
    UserStatusChange:
      properties:
        status:
          $ref: '#/components/schemas/SettableUserStatus'
          description: Target account status. Only `active` and `inactive` are settable — an account still onboarding (`invited`
            / `pending`) is owned by the invitation and verification flows.
          examples:
          - inactive
      type: object
      required:
      - status
      title: UserStatusChange
      description: Payload accepted by `POST /v1/auth/users/{user_id}/status`.
      example:
        status: inactive
    UserStatusTarget:
      properties:
        user_id:
          type: string
          format: uuid
          title: User Id
          description: User whose account status will be changed.
        status:
          $ref: '#/components/schemas/SettableUserStatus'
          description: Target account status for this row. Only `active` and `inactive` are settable.
          examples:
          - inactive
      type: object
      required:
      - user_id
      - status
      title: UserStatusTarget
      description: 'A user and the status to put them in — bulk row and its result.


        The target status is per row because `BulkRequest` carries no batch-level

        fields; a UI activating a selection fills every row with the same value.'
    UserUpdate:
      properties:
        first_name:
          anyOf:
          - type: string
            maxLength: 255
          - type: 'null'
          title: First Name
          description: New given name.
          examples:
          - Ada
        last_name:
          anyOf:
          - type: string
            maxLength: 255
          - type: 'null'
          title: Last Name
          description: New family name.
          examples:
          - L.
        role_ids:
          anyOf:
          - items:
              type: string
              format: uuid
            type: array
            minItems: 1
          - type: 'null'
          title: Role Ids
          description: Replacement set of role IDs. Omit to leave unchanged; if supplied, must be non-empty.
          examples:
          - - a1b2c3d4-1111-2222-3333-444455556666
      type: object
      title: UserUpdate
      description: 'Payload accepted by `PATCH /v1/auth/users/{user_id}`. All fields optional.


        Supplying `role_ids` replaces the user''s full role set; the new set must

        contain at least one role (a user is never left role-less).'
      example:
        first_name: Ada
        last_name: L.
        role_ids:
        - a1b2c3d4-1111-2222-3333-444455556666
    VersionResponse:
      properties:
        version:
          type: string
          title: Version
        environment:
          type: string
          title: Environment
      type: object
      required:
      - version
      - environment
      title: VersionResponse
      description: Deployed build identity — commit SHA plus the runtime environment.
    WarmupResponse:
      properties:
        status:
          $ref: '#/components/schemas/WarmupStatus'
          description: '`ready` to send, `starting` (retry), or `error` (won''t recover).'
      type: object
      required:
      - status
      title: WarmupResponse
      description: 'Result of a warmup probe against a model assignment.


        A deliberately opaque enum — no provider identity, no upstream error text — so

        it is safe to return under a masked evaluation.'
      example:
        status: starting
    WarmupStatus:
      type: string
      enum:
      - ready
      - starting
      - error
      title: WarmupStatus
      description: 'Result of probing a model endpoint for readiness (see `dispatch_probe`).


        `starting` is the scale-to-zero case: the endpoint is unreachable/initializing

        and the probe just triggered (or is awaiting) its wake — retry. `error` is a

        terminal fault (auth, bad request, a model that cannot answer in text) a retry won''t fix.'
