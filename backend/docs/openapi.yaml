          - ada@example.com
        email_verified:
          type: boolean
          title: Email Verified
          description: Whether the email was verified by the authenticating provider.
          default: false
          examples:
          - true
        first_name:
          anyOf:
          - type: string
          - type: 'null'
          title: First Name
