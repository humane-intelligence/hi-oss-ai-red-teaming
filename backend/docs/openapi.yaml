    post:
      tags:
      - exports
      summary: Request an export
      description: Queue a background export job. `template` selects what to export; exactly one of `evaluation_id` / `evaluation_group_id`
        sets the scope. Only a group owner or an administrator may export. Poll `GET /api/v1/exports/jobs/{id}` until `ready`,
        then download it. Pass an `idempotency_key` to make a retry safe — a repeat with the same key returns the already-queued
        job instead of generating a duplicate. Reusing a key for a *different* template/scope, or losing a create race on
        the key, is a `409`.
