      summary: Duplicate evaluation
      description: Copy an evaluation into a new one in the same group, owned by the caller, starting in `new`. With `include_children=true`
        its model assignments, scenarios, and tasks are cloned too (runtime data — conversations, flags, reviews — and API
        keys are never copied); the default clones the evaluation only. The admin tag schema (both tag flags and the allowed
        keys) always travels with the copy, children or not, so a duplicate can't silently drop the restriction. The group
        must be `approved` or `published` — duplicating follows the same lifecycle gate as a create. Requires `evaluations:create`,
        and the caller must hold write access on the source — an in-group role granting `evaluations:create` (the creator
        holds `owner`), or the `evaluation_groups:manage` break-glass. Merely being able to see the source is not enough.
