          - type: string
          - type: 'null'
          title: Last Name
          description: Family name, if known.
          examples:
          - Lovelace
        provider:
          type: string
          title: Provider
          description: Mechanism that authenticated this session — OIDC provider name (e.g. "google") or "local".
          examples:
          - google
        has_password:
          type: boolean
          title: Has Password
          description: Whether the account has a local password set, resolved live from the database. False for passwordless
            accounts (IdP-only, or an OIDC activation cleared it) — they cannot use the password-change endpoint.
          default: false
          examples:
          - false
        organization:
          anyOf:
          - $ref: '#/components/schemas/OrganizationBase'
          - type: 'null'
          description: Organization the caller belongs to, resolved live from the database. Null when orgless or when the
            organization has been deleted.
        roles:
          items:
            $ref: '#/components/schemas/RoleSummary'
          type: array
          title: Roles
          description: Roles currently held by the caller (identity + label), resolved live from the database.
        permissions:
          items:
            type: string
          type: array
          title: Permissions
          description: Effective permissions — the flattened union across the caller's roles. Same strings as the JWT `permissions`
            claim and the `/roles` catalog. Gate the UI on this union, not on a single role's permissions.
          examples:
          - - conversations:create
            - flags:create
        consent_terms:
          type: boolean
          title: Consent Terms
          description: Whether the account has accepted a version of the terms of service. Derived from the acceptance record
            itself, so it cannot disagree with it.
          default: false
          examples:
          - true
        consent_emails:
          type: boolean
          title: Consent Emails
          description: Whether the user agreed to receive email beyond the transactional kind. Recorded only — every template
            the platform sends today is transactional and goes out regardless.
          default: false
          examples:
          - false
        accepted_terms:
          anyOf:
          - $ref: '#/components/schemas/TermsDocumentSummary'
          - type: 'null'
          description: 'The version this account actually accepted. Null when it never accepted one, or when that version
            was tombstoned straight in the database (nothing in the API deletes one), which leaves `terms_accepted_at` set
            on its own. Not necessarily the current one: a client that names the current version next to `terms_accepted_at`
            states something false about the consent record whenever a newer version has landed.'
        terms_accepted_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Terms Accepted At
          description: When the account accepted the version it has on record (UTC), or null if never. Stays set when `accepted_terms`
            reads null because that version was tombstoned.
        terms_acceptance_required:
          type: boolean
          title: Terms Acceptance Required
          description: 'Whether the client must block the app on the acceptance gate: a version is published and this account
            has not accepted it. False while the platform has published none. A convenience, not the enforcement — while it
            is true, every authenticated endpoint except the ones that clear it answers 403 regardless of what the client
            does.'
          default: false
          examples:
          - false
      type: object
      required:
      - id
      - email
      - provider
      title: MeResponse
      description: 'Body of `/v1/auth/me` — the caller''s identity plus their RBAC state.


        Session fields (`id`, `email`, `email_verified`, `provider`) are projected

        from the current bearer token. `provider` describes how this session was

        authenticated, not who the user is: an OIDC provider name or `"local"`

        for password auth.


        `first_name` / `last_name` / `has_password`, like `roles` and

        `permissions`, are resolved from the live database, not the token, so a

        rename or role change refetches fresh without waiting for the JWT to be

        re-minted. `permissions` is the flattened union across `roles` (the same

        value the JWT `permissions` claim carries at mint time) — the FE checks it

        as one flat set. For a session with no backing DB row (the user was

        soft-deleted after the token was minted) everything falls back to the

        token: names from the claims, `roles` empty, `permissions` the JWT claim,

        `has_password` false.'
      example:
        email: ada@example.com
        email_verified: true
        first_name: Ada
        has_password: false
        id: f3a1d2b4-1c2e-4f56-8a7b-9c0d1e2f3a4b
        last_name: Lovelace
        permissions:
        - conversations:create
        - flags:create
        provider: google
        roles:
        - display_name: Red Teamer
          id: a1b2c3d4-1111-2222-3333-444455556666
          name: red_teamer
    MeUpdate:
      properties:
        first_name:
          anyOf:
          - type: string
            maxLength: 255
          - type: 'null'
          title: First Name
          description: New given name.
          examples:
          - Ada
        last_name:
          anyOf:
          - type: string
            maxLength: 255
          - type: 'null'
          title: Last Name
          description: New family name.
          examples:
          - L.
        consent_emails:
          anyOf:
          - type: boolean
          - type: 'null'
