          type: array
          title: Evaluations
          description: Full child evaluations (models included, masking applied), ordered by creation.
        user_permissions:
          items:
            type: string
          type: array
          title: User Permissions
          description: The caller's effective permissions on this group — the union of what their in-group roles grant (empty
            for a non-member; the object type's full vocabulary for an `evaluation_groups:manage` break-glass holder). `evaluation_groups:view_metrics`
            additionally appears whenever the group's configured metrics-access level grants the caller the dashboards, not
            only via a held role. Gate group-scoped actions on these. Per the object-role model these are whole-role permission
            sets, so platform-wide entries a role also carries (e.g. `users:invite`) may appear and are not group-scoped —
            gate only on the group-relevant keys (`evaluation_groups:*`, `evaluations:*`).
        allowed_models:
          anyOf:
          - items:
              $ref: '#/components/schemas/EvaluationGroupAiModelResponse'
            type: array
          - type: 'null'
          title: Allowed Models
          description: 'The group''s allowed-model subset — the models its evaluations may be assigned. `null` when the caller
            lacks `models:read`: the identities are hidden, not merely empty.'
        publication_blockers:
          items:
            type: string
          type: array
          title: Publication Blockers
          description: 'Human-readable gaps blocking the group''s **next** lifecycle step, empty when it is ready: for `draft`
            / `changes_requested` what `submit` would refuse (missing fields, dates, organization, allowed models, evaluations
            without a scenario), for `approved` what `publish` would refuse (no evaluations, or one without a scenario). Always
            empty for the other statuses — `pending_approval` waits on a moderator, `published` on the owner finishing it,
            the terminal ones on nothing. Same sentences the matching 400 carries, so a UI can show the list before the owner
            clicks and never disagree with the refusal. The scenario entry names each offending evaluation as `title (id)`
            — the id is carried deliberately, since titles are not unique within a group, so this is the one place a raw id
            is meant to reach the UI.'
