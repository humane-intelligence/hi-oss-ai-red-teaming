          examples:
          - - b2c3d4e5-2222-3333-4444-555566667777
      type: object
      required:
      - email
      - role_ids
      title: GroupInvitationCreate
      description: One invitee row of a group-invitation bulk request, with one or more roles pre-assigned.
      example:
        email: ada@example.com
        role_ids:
        - b2c3d4e5-2222-3333-4444-555566667777
    GroupInvitationResponse:
      properties:
        outcome:
          type: string
          enum:
          - assigned
          - invited
          title: Outcome
          description: '`assigned` — the email belonged to an active account; `invited` — an onboarding token was sent.'
        user_id:
          type: string
          format: uuid
          title: User Id
          description: Identifier of the invited (or assigned) user.
        email:
          type: string
          title: Email
          description: Email the invitation targets.
        roles:
          items:
            $ref: '#/components/schemas/RoleSummary'
          type: array
          title: Roles
          description: In-group roles assigned on the group.
        expires_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Expires At
          description: Token expiry for the `invited` outcome; `null` when assigned immediately.
      type: object
      required:
      - outcome
      - user_id
      - email
      - roles
      title: GroupInvitationResponse
      description: 'Result of a group invitation.


        The roles are assigned on the group immediately in both outcomes; `outcome`

        only distinguishes whether the account was already active (`assigned`) or a

        token was emailed to onboard it (`invited`).'
      example:
        email: ada@example.com
        expires_at: '2026-06-17T10:00:00Z'
        outcome: invited
        roles:
        - display_name: Red Teamer
          id: b2c3d4e5-2222-3333-4444-555566667777
          name: red_teamer
        user_id: a1b2c3d4-1111-2222-3333-444455556666
    GroupTaskCompletionRollup:
      properties:
        total_conversations:
          type: integer
          title: Total Conversations
          description: Live conversations in the group (the denominator).
        completed_counts:
          items:
            $ref: '#/components/schemas/TaskCompletionCount'
          type: array
          title: Completed Counts
          description: Per-task completed-conversation counts; tasks with none are omitted.
      type: object
      required:
      - total_conversations
      - completed_counts
      title: GroupTaskCompletionRollup
      description: 'Read-only per-task roll-up across one conversation group.


        `total_conversations` is the group''s live conversation count (the "N" in

        "K/N"); `completed_counts` carries only tasks with at least one completion —

        the client defaults every other task to 0 (mirroring `flag_counts_by_message`).'
      example:
        completed_counts:
        - completed_count: 1
          task_id: 5d4c3b2a-9f8e-4d3c-2b1a-0f9e8d7c6b5a
        total_conversations: 2
    GroupTokensByModelMetrics:
      properties:
        ai_model_id:
          type: string
          format: uuid
          title: Ai Model Id
          description: The registry model (`AiModel`) this spend was against.
        model_alias:
          type: string
          title: Model Alias
          description: The model's real alias — this list is only ever served unmasked.
        tokens:
          $ref: '#/components/schemas/TokenMetrics'
      type: object
      required:
      - ai_model_id
      - model_alias
      - tokens
      title: GroupTokensByModelMetrics
      description: 'Group-wide token spend attributed to one underlying registry model.


        The evaluation-level sibling `TokensByModelMetrics` keys on the *assignment*; this keys on the

        `AiModel` itself, so a model assigned to several of the group''s evaluations is one row summing

        all of them — "what did this model cost across the event", the question the group dashboard

        asks. `EvaluationAiModelView` withholds exactly this correlation under masking, which is why

        the whole list is withheld rather than masked per row (see `tokens_by_model` on the response).'
    HealthCheckStatus:
      type: string
      enum:
      - checking
      - alive
      - dead
      title: HealthCheckStatus
      description: 'Result of a manual endpoint health check (see `ai_gateway.services.health`).


        `checking` is in flight (a Celery task is probing, possibly waiting out a cold

        start); `alive`/`dead` are settled. A `null` column means never checked.'
    ImageContentPart:
      properties:
        type:
          type: string
          const: image_url
          title: Type
          default: image_url
        image_url:
          $ref: '#/components/schemas/ImageUrl'
      type: object
      required:
      - image_url
      title: ImageContentPart
      description: An image fragment of a multi-modal message (OpenAI content-part shape).
    ImageUrl:
      properties:
        url:
          type: string
          title: Url
      type: object
      required:
      - url
      title: ImageUrl
      description: '`image_url` payload — a `data:` URI carrying the image inline.


        Constrained to the `data:` scheme: this type is public via `/chat/stream`, and a

        fetchable URL would let a caller make the provider (or litellm inlining) request an

        arbitrary host from our infrastructure (SSRF). Our write-path always inlines the

        blob as base64 (`read_data_url`), so nothing legitimate needs a remote URL.'
    InferenceParams:
      properties:
        system_prompt:
          anyOf:
          - type: string
          - type: 'null'
          title: System Prompt
          description: Prepended to every conversation by the gateway.
        temperature:
          anyOf:
          - type: number
            maximum: 2.0
            minimum: 0.0
          - type: 'null'
          title: Temperature
          description: Sampling temperature.
        top_p:
          anyOf:
          - type: number
            maximum: 1.0
            minimum: 0.0
          - type: 'null'
          title: Top P
          description: Nucleus-sampling probability.
        top_k:
          anyOf:
          - type: integer
            minimum: 0.0
          - type: 'null'
          title: Top K
          description: Top-k sampling cutoff.
        max_tokens:
          anyOf:
          - type: integer
            minimum: 1.0
          - type: 'null'
          title: Max Tokens
          description: Cap on generated tokens.
        stop_sequences:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Stop Sequences
          description: Sequences that abort generation.
        frequency_penalty:
          anyOf:
          - type: number
            maximum: 2.0
            minimum: -2.0
          - type: 'null'
          title: Frequency Penalty
          description: OpenAI/Cohere-style frequency penalty.
        presence_penalty:
          anyOf:
          - type: number
            maximum: 2.0
            minimum: -2.0
          - type: 'null'
          title: Presence Penalty
          description: OpenAI/Cohere-style presence penalty.
        repetition_penalty:
          anyOf:
          - type: number
            minimum: 0.0
          - type: 'null'
          title: Repetition Penalty
          description: HF-style repetition penalty.
        seed:
          anyOf:
          - type: integer
          - type: 'null'
          title: Seed
          description: Deterministic-sampling seed where supported.
      additionalProperties: true
      type: object
      title: InferenceParams
      description: 'Typed view of the `parameters` JSONB column.


        `extra="allow"` keeps the door open for provider-specific knobs that

        haven''t earned a Python field yet — the structured fields below carry

        documentation and validation for the ones the platform uses today.'
    InvitationAccept:
      properties:
        token:
          type: string
          minLength: 1
          title: Token
          description: Raw invitation token from the accept URL.
        password:
          type: string
          maxLength: 128
          minLength: 8
          format: password
          title: Password
          description: New password.
          writeOnly: true
        first_name:
          anyOf:
          - type: string
            maxLength: 255
          - type: 'null'
          title: First Name
          description: Given name. Optional.
        last_name:
          anyOf:
          - type: string
            maxLength: 255
          - type: 'null'
          title: Last Name
          description: Family name. Optional.
        consent_terms:
          type: boolean
          title: Consent Terms
          description: Whether the user accepts the current terms of service. Required while a version is published — a false
            value is refused with 400 (`errors[].type` is `consent_terms_required`). Ignored while the platform has published
            none.
          default: false
          examples:
          - true
        consent_emails:
          type: boolean
          title: Consent Emails
          description: Whether to receive email beyond the transactional kind. Recorded only, not yet enforced.
          default: false
          examples:
          - false
        terms_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Terms Id
          description: 'The terms version being accepted — the `id` from `GET /api/v1/terms/current`. Required alongside `consent_terms`
            while a version is published: consent is recorded against the version the form actually rendered, so a stale (or
            omitted) id is refused with 409 rather than silently recorded against newer text.'
      type: object
      required:
      - token
      - password
      title: InvitationAccept
      description: Payload accepted by `POST /v1/auth/invitations/accept`.
      example:
        consent_emails: false
        consent_terms: true
        first_name: Ada
        last_name: Lovelace
        password: supersecret-12345
        terms_id: 7c9e6679-7425-40de-944b-e07fc1f90ae7
        token: rUvY9N6_…
    InvitationBulkRequest:
      properties:
        rows:
          items:
            $ref: '#/components/schemas/BulkRow_InvitationCreate_'
          type: array
          maxItems: 100
          minItems: 1
          title: Rows
          description: Invitees, at least one and at most 100.
        dry_run:
          type: boolean
          title: Dry Run
