    MessageRole:
      type: string
      enum:
      - user
      - assistant
      - system
      title: MessageRole
      description: Author of a message. Closed set — adding a value needs a migration (`ALTER TYPE ... ADD VALUE`).
    MessageStatus:
      type: string
      enum:
      - streaming
      - complete
      - interrupted
      - error
      title: MessageStatus
      description: 'Generation lifecycle of a message, orthogonal to soft-delete (`deleted_at`).


        A user/system message lands `complete`; an assistant placeholder opens

        `streaming` and finalises to `complete`, `interrupted` (handled

        disconnect/timeout — partial text kept), or `error` (model failure). The set

        is closed — adding a value needs a migration (`ALTER TYPE ... ADD VALUE`).'
    MetricsAccessLevel:
      type: string
      enum:
      - inherit_group_access
      - all_members
      - members_personal_metrics
      - owner_only
      title: MetricsAccessLevel
      description: 'Who may read a group''s metrics dashboards — a separate axis from group visibility.


        A group carries one value for while it runs (`metrics_access_during`) and one

        for after it finished (`metrics_access_after`, applied iff the group''s status

        is `inactive`). Group visibility always gates first (an invisible group reads

        as 404 regardless of level), and the in-group `owner` and the

        `evaluation_groups:manage` break-glass see the *full* dashboards at every

        level. The levels widen from there: `owner_only` adds nobody;

        `members_personal_metrics` admits members holding

        `evaluation_groups:view_personal_metrics` (the `red_teamer` role) but scopes

        their dashboards to *their own* contributions only — a permission, not a

        role-name check, so future custom roles opt in by carrying it;

        `all_members` admits any member to the full dashboards; `inherit_group_access`

        admits whoever can see the group at all (the group''s own `access_level` is the

        audience — never anonymous) to the full dashboards. The set is closed — adding

        a value requires a migration (`ALTER TYPE ... ADD VALUE`).'
    MetricsScope:
      type: string
      enum:
      - full
      - personal
      title: MetricsScope
      description: 'The breadth of a granted metrics read — the output of the access policy.


        `full` is the whole-event aggregate (every member''s contributions);

        `personal` is the same dashboards filtered to the caller''s own submissions,

        conversations, and the reviews of their submissions. The policy

        (`resolve_metrics_scope`) returns one of these when access is granted, or

        `None` when it is denied (a 403). Surfaced on the metrics responses so the

        client can badge a personal view.'
    Modality:
      type: string
      enum:
      - text
      - image
      title: Modality
      description: 'A kind of content a model takes in or gives back.


        A declaration is a set: the server dedupes it and re-sorts it into the order

        below, so equal declarations store and render identically. An input set must

        include `text` (every dispatched call carries a text prompt) and an output set

        must be non-empty — on create and on PATCH alike, which replaces a set wholesale

        rather than merging into it.


        Held in the `input_modalities` / `output_modalities` array columns as plain text

        rather than a DB enum, so adding a modality (audio, video) is a code change

        instead of an `ALTER TYPE`. The cost is that the column no longer refuses an

        out-of-set value at write time while every read path stays strict — unlike

        `AuditAction`, whose column and wire type are both `str` and which therefore

        passes an unknown value through harmlessly.'
