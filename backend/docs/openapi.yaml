    RoleSummary:
      properties:
        id:
          type: string
          format: uuid
          title: Id
          description: Server-assigned role identifier.
          examples:
          - a1b2c3d4-1111-2222-3333-444455556666
        name:
          type: string
          title: Name
          description: Stable role slug — used as the machine identifier.
          examples:
          - red_teamer
        display_name:
          type: string
          title: Display Name
          description: Human-readable role label for display.
          examples:
          - Red Teamer
      type: object
      required:
      - id
      - name
      - display_name
      title: RoleSummary
      description: 'Slim role projection embedded wherever a response lists a user''s roles.


        Four embed sites: identity (`/auth/me`, user responses) and object

        membership (`ObjectMemberResponse`, `GroupInvitationResponse`).

        Identity + display label only: no `permissions` (clients gate on the

        flattened `permissions` union, e.g. `MeResponse.permissions`), no

        `description` / `is_system`. The full role object with its grant set is

        served by the `/roles` catalog (`RoleResponse`).'
    RoleUpdate:
      properties:
        display_name:
          anyOf:
          - type: string
            maxLength: 128
            minLength: 1
          - type: 'null'
          title: Display Name
          description: New label. Omit to leave unchanged; `null` is rejected.
        description:
          anyOf:
          - type: string
            maxLength: 255
          - type: 'null'
          title: Description
          description: New purpose; `null` clears the existing one.
        permissions:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Permissions
          description: Replacement permission set (custom roles only). Omit to leave unchanged; `null` is rejected.
        is_active:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Is Active
          description: Activate or deactivate the role. Omit to leave unchanged; `null` is rejected.
        is_default:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Is Default
          description: Set this role as the sole new-user default. Omit to leave unchanged; `null` is rejected.
        is_participant_default:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Is Participant Default
          description: Set this role as the sole group self-join participant default. Omit to leave unchanged; `null` is rejected.
        is_object_assignable:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Is Object Assignable
          description: Allow this role to be held as an in-group (object) role, not only globally (custom roles only). Omit
            to leave unchanged; `null` is rejected.
      additionalProperties: false
      type: object
      title: RoleUpdate
      description: 'Payload for `PATCH /v1/roles/{role_id}` — all fields optional.


        Custom roles accept `display_name` / `description` / `permissions` /

        `is_object_assignable` edits; system roles accept only `is_active` / `is_default` /

        `is_participant_default` (their code-owned fields reject edits, and their

        object-assignability is re-synced from code on every deploy). `is_default: true`

        makes this the sole new-user default and `is_participant_default: true` the sole

        group self-join default, each clearing the previous holder; neither flag can be

        cleared directly (reassign instead).


        Omitting a field leaves it unchanged. `description` is the only nullable column, so

        it is the only field where an explicit `null` means something (it clears); every

        other field rejects `null` rather than silently ignoring it.'
      example:
