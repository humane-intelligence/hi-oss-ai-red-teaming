      - terms
      summary: Publish a terms of service version
      description: 'Publish a new version, which immediately becomes the one every account must accept: every user whose recorded
        consent points at an older version is refused by the API until they accept it, the publishing admin included — so
        publishing a correction means accepting the flawed version first. Versions are immutable — there is no edit; correcting
        text means publishing the next version.'
      operationId: publish_terms_endpoint_api_v1_terms_post
      requestBody:
        required: true
        content:
