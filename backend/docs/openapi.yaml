    PasswordChange:
      properties:
        current_password:
          type: string
          format: password
          title: Current Password
          description: The password currently on the account.
          writeOnly: true
        password:
          type: string
          maxLength: 128
          minLength: 8
          format: password
          title: Password
          description: New password.
          writeOnly: true
      type: object
      required:
      - current_password
      - password
      title: PasswordChange
      description: Payload accepted by `POST /v1/auth/me/password`.
      example:
        current_password: correct horse battery staple
        password: supersecret-12345
    PasswordResetBulkRequest:
      properties:
        rows:
          items:
            $ref: '#/components/schemas/BulkRow_PasswordResetTarget_'
          type: array
          maxItems: 100
          minItems: 1
          title: Rows
          description: Users to send a reset link to, at least one and at most 100.
        dry_run:
          type: boolean
          title: Dry Run
          description: If true, the request is processed and rolled back instead of committed.
          default: false
      type: object
      required:
      - rows
      title: PasswordResetBulkRequest
      description: 'Bulk envelope of `POST /v1/auth/users/password-reset`.


        Shares `MAX_INVITE_ROWS` with the invitation bulks for the same reason — every

        row mails a real person, so an over-broad selection must bounce at validation

        rather than in the outbox.'
    PasswordResetConfirm:
      properties:
        token:
          type: string
          minLength: 1
          title: Token
          description: Raw token from the password-reset email.
        password:
          type: string
          maxLength: 128
          minLength: 8
          format: password
          title: Password
          description: New password.
          writeOnly: true
      type: object
      required:
      - token
      - password
      title: PasswordResetConfirm
      description: Payload accepted by `POST /v1/auth/password-resets/confirm`.
      example:
        password: supersecret-12345
        token: rUvY9N6_…
    PasswordResetRequest:
      properties:
        email:
          type: string
          format: email
          title: Email
          description: Account email.
          examples:
          - ada@example.com
      type: object
      required:
      - email
      title: PasswordResetRequest
      description: Payload accepted by `POST /v1/auth/password-resets/request`.
      example:
        email: ada@example.com
    PasswordResetTarget:
      properties:
        user_id:
          type: string
          format: uuid
          title: User Id
          description: User who will be sent a password-reset link.
      type: object
      required:
      - user_id
      title: PasswordResetTarget
      description: A user to mail a password-reset link to — bulk row and its result.
    PermissionResponse:
      properties:
        key:
          type: string
          title: Key
          description: Namespaced permission string, `<resource>:<action>`.
          examples:
          - evaluations:approve
        description:
          type: string
          title: Description
          description: Human-readable purpose of the permission.
          examples:
          - Approve or reject evaluations.
        is_delegable:
          type: boolean
          title: Is Delegable
          description: Whether a custom role may carry this permission. `false` marks an elevation vector reserved for system
            roles — role builders should omit it, and `POST`/`PATCH /roles` reject it.
          examples:
          - true
      type: object
      required:
      - key
      - description
      - is_delegable
      title: PermissionResponse
      description: One entry in the permission catalog — a namespaced key, its description, and delegability.
      example:
        description: Approve or reject evaluations.
        is_delegable: true
        key: evaluations:approve
    PlatformSettingsResponse:
      properties:
        default_license_id:
          type: string
          format: uuid
          title: Default License Id
          description: Licence id of the platform default data license.
        invite_only:
          type: boolean
          title: Invite Only
          description: Invite-only mode — open self-signup (`POST /api/v1/auth/register`) is refused while set.
        email_verification_ttl_hours:
          type: integer
          title: Email Verification Ttl Hours
          description: How long a self-signup email-verification link stays valid, in hours.
        password_min_length:
          type: integer
          title: Password Min Length
          description: Minimum length of a newly set password, in characters.
        password_require_uppercase:
          type: boolean
          title: Password Require Uppercase
          description: Whether a new password must contain an uppercase letter.
        password_require_digit:
          type: boolean
          title: Password Require Digit
          description: Whether a new password must contain a digit.
        password_require_symbol:
          type: boolean
          title: Password Require Symbol
          description: Whether a new password must contain a symbol (anything that is not a letter or a digit).
        password_reset_cooldown_seconds:
          type: integer
          title: Password Reset Cooldown Seconds
          description: Minimum gap between two self-service password-reset requests for one account, in seconds; `0` disables
            it. Admin-triggered sends ignore the gap but start it.
        password_reset_max_per_day:
          type: integer
          title: Password Reset Max Per Day
          description: How many self-service password-reset requests one account can make per rolling 24 hours. Admin-triggered
            sends are not bound by the cap but consume it.
        updated_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Updated At
          description: When the settings were last overridden; `null` means they are still the shipped defaults.
      type: object
      required:
      - default_license_id
      - invite_only
      - email_verification_ttl_hours
      - password_min_length
      - password_require_uppercase
      - password_require_digit
      - password_require_symbol
      - password_reset_cooldown_seconds
      - password_reset_max_per_day
      title: PlatformSettingsResponse
      description: Platform-wide settings — data licensing, registration, password policy, reset throttling.
      example:
        default_license_id: 7c9e6679-7425-40de-944b-e07fc1f90ae7
        email_verification_ttl_hours: 24
        invite_only: false
        password_min_length: 8
        password_require_digit: false
        password_require_symbol: false
        password_require_uppercase: false
        password_reset_cooldown_seconds: 60
        password_reset_max_per_day: 5
        updated_at: '2026-06-24T08:00:00Z'
    PlatformSettingsUpdate:
      properties:
        default_license_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Default License Id
          description: Licence id (`GET /api/v1/licenses`). Omit to leave unchanged; must reference a live licence other than
            `No license`, which cannot be the platform default.
        invite_only:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Invite Only
          description: Enable/disable invite-only mode (refuse open self-signup). Omit to leave unchanged.
        email_verification_ttl_hours:
          anyOf:
          - type: integer
            maximum: 8760.0
            minimum: 1.0
          - type: 'null'
          title: Email Verification Ttl Hours
          description: Verification-link lifetime in hours (1-8760). Omit to leave unchanged.
        password_min_length:
          anyOf:
          - type: integer
            maximum: 128.0
            minimum: 8.0
          - type: 'null'
          title: Password Min Length
          description: Minimum password length in characters (8-128). Omit to leave unchanged.
        password_require_uppercase:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Password Require Uppercase
          description: Require an uppercase letter in new passwords. Omit to leave unchanged.
        password_require_digit:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Password Require Digit
          description: Require a digit in new passwords. Omit to leave unchanged.
        password_require_symbol:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Password Require Symbol
          description: Require a symbol (non-letter, non-digit) in new passwords. Omit to leave unchanged.
        password_reset_cooldown_seconds:
          anyOf:
          - type: integer
            maximum: 3600.0
            minimum: 0.0
          - type: 'null'
          title: Password Reset Cooldown Seconds
          description: Minimum gap between two self-service reset requests for one account, in seconds (0-3600; 0 disables).
            Admin-triggered sends ignore the gap but start it. Omit to leave unchanged.
        password_reset_max_per_day:
          anyOf:
          - type: integer
            maximum: 100.0
            minimum: 1.0
          - type: 'null'
          title: Password Reset Max Per Day
          description: Self-service reset requests one account can make per rolling 24 hours (1-100). Admin-triggered sends
            are not bound by the cap but consume it. Omit to leave unchanged.
      additionalProperties: false
      type: object
      title: PlatformSettingsUpdate
      description: Patch platform settings. Omit a field to leave it unchanged.
    Problem:
      properties:
        type:
          type: string
          title: Type
          description: URI identifying the problem type. `about:blank` means generic.
          default: about:blank
          examples:
          - about:blank
          - urn:redteam:error:terms-acceptance-required
        title:
          type: string
          title: Title
          description: Short, human-readable summary. Stable per `type`.
          examples:
          - Not Found
        status:
          type: integer
          title: Status
          description: HTTP status code; mirrors the response status.
          examples:
          - 404
        detail:
          anyOf:
          - type: string
          - type: 'null'
          title: Detail
          description: Human-readable explanation specific to this occurrence.
          examples:
          - User 7f3a not found.
        instance:
          anyOf:
          - type: string
          - type: 'null'
          title: Instance
          description: URI reference identifying the specific occurrence (typically the request path).
          examples:
          - /api/v1/auth/users/7f3a
        errors:
          anyOf:
          - items:
              $ref: '#/components/schemas/ProblemErrorItem'
            type: array
          - type: 'null'
          title: Errors
          description: Field-level errors keyed to the offending request fields. Present on 422 schema-validation failures
            and on field-addressable business-rule errors (e.g. the password-policy 400).
      type: object
      required:
      - title
      - status
      title: Problem
      description: 'RFC 7807 Problem Details envelope.


        Every error response in this API has this shape and is served with

        `Content-Type: application/problem+json`. Clients should branch on

        `status` and (optionally) `type` rather than parsing `detail`.'
      example:
        detail: User 7f3a not found.
        instance: /api/v1/auth/users/7f3a
        status: 404
        title: Not Found
        type: about:blank
    ProblemErrorItem:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Loc
          description: Path to the offending field (e.g. ['body', 'name']).
          examples:
          - - body
            - name
        msg:
          type: string
          title: Msg
          description: Human-readable explanation of what went wrong.
          examples:
          - Field required
        type:
          type: string
          title: Type
          description: Machine-readable error type from the validator.
          examples:
          - missing
      type: object
      required:
      - loc
      - msg
      - type
      title: ProblemErrorItem
      description: 'One field-level error inside a `Problem.errors` list.


        Mirrors Pydantic''s `ValidationError.errors()` shape so 422 responses

        can be forwarded verbatim by the validation handler.'
    ProviderVendor:
      type: string
      enum:
      - huggingface
      - google
      - openai
      - anthropic
      - azure
      - generic
      - aws_bedrock
      - cohere
      title: ProviderVendor
      description: 'Vendor whose API a given `AiModel` row routes to.


        The set is intentionally closed — adding a provider requires a migration

        (`ALTER TYPE ... ADD VALUE`) so the gateway-side strategy table stays in

        sync with what the DB can hold.'
    PublicPasswordPolicyResponse:
      properties:
        min_length:
          type: integer
          title: Min Length
          description: Minimum length of a new password, in characters.
        require_uppercase:
          type: boolean
          title: Require Uppercase
          description: Whether a new password must contain an uppercase letter.
        require_digit:
          type: boolean
          title: Require Digit
          description: Whether a new password must contain a digit.
        require_symbol:
          type: boolean
          title: Require Symbol
          description: Whether a new password must contain a symbol (anything that is not a letter or a digit).
      type: object
      required:
      - min_length
      - require_uppercase
      - require_digit
      - require_symbol
      title: PublicPasswordPolicyResponse
      description: The password rules a client can state up front, so a user isn't told them by a rejection.
      example:
        min_length: 8
        require_digit: false
        require_symbol: false
        require_uppercase: false
    PublicPlatformSettingsResponse:
      properties:
        signup_enabled:
          type: boolean
          title: Signup Enabled
          description: Whether open self-signup (`POST /api/v1/auth/register`) is enabled — the inverse of invite-only mode.
        password_policy:
          $ref: '#/components/schemas/PublicPasswordPolicyResponse'
          description: Rules every screen that sets a password must satisfy. The reset-throttling settings are deliberately
            not here — they are operational, not part of the form contract.
      type: object
      required:
      - signup_enabled
      - password_policy
      title: PublicPlatformSettingsResponse
      description: Unauthenticated subset of platform settings — safe to expose to anonymous clients.
      example:
        password_policy:
          min_length: 8
          require_digit: false
          require_symbol: false
          require_uppercase: false
        signup_enabled: true
    PublicationStatus:
      type: string
      enum:
      - draft
      - pending_approval
      - changes_requested
      - approved
      - not_approved
      - published
      - inactive
      title: PublicationStatus
      description: 'Review + publish lifecycle state of an evaluation (and later, an evaluation group).


        Spans two concerns deliberately: a moderation workflow

        (`pending_approval` → `changes_requested` / `approved` / `not_approved`)

        and a publish lifecycle (`draft` → `published` → `inactive`). The set is

        closed — adding a state requires a migration (`ALTER TYPE ... ADD VALUE`).'
    ReadinessResponse:
      properties:
        status:
          type: string
          enum:
          - ok
          - unavailable
          title: Status
        checks:
          additionalProperties:
            $ref: '#/components/schemas/CheckResult'
          type: object
          title: Checks
      type: object
      required:
      - status
      - checks
      title: ReadinessResponse
      description: Aggregate readiness payload — one entry per checked dependency.
    RefreshRequest:
      properties:
        refresh_token:
          type: string
          minLength: 1
          title: Refresh Token
          description: Signed refresh JWT previously issued in a `TokenResponse`.
          examples:
          - eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ0eXAiOiJyZWZyZXNoIn0...
      type: object
      required:
      - refresh_token
      title: RefreshRequest
      description: Payload accepted by `POST /v1/auth/refresh` — the refresh token to exchange.
      example:
        refresh_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ0eXAiOiJyZWZyZXNoIn0...
    RegisterRequest:
      properties:
        email:
          type: string
          format: email
          title: Email
          description: Primary email address. Normalized to lowercase.
          examples:
          - ada@example.com
        password:
          type: string
          maxLength: 128
          minLength: 8
          format: password
          title: Password
          description: New password.
          writeOnly: true
        first_name:
          anyOf:
          - type: string
            maxLength: 255
          - type: 'null'
          title: First Name
          description: Given name. Optional.
        last_name:
          anyOf:
          - type: string
            maxLength: 255
          - type: 'null'
          title: Last Name
          description: Family name. Optional.
        consent_terms:
          type: boolean
          title: Consent Terms
          description: Whether the user accepts the current terms of service. Required while a version is published — a false
            value is refused with 400 (`errors[].type` is `consent_terms_required`). Ignored while the platform has published
            none.
          default: false
          examples:
          - true
        consent_emails:
          type: boolean
          title: Consent Emails
          description: Whether to receive email beyond the transactional kind. Recorded only, not yet enforced.
          default: false
          examples:
          - false
        terms_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Terms Id
          description: 'The terms version being accepted — the `id` from `GET /api/v1/terms/current`. Required alongside `consent_terms`
            while a version is published: consent is recorded against the version the form actually rendered, so a stale (or
            omitted) id is refused with 409 rather than silently recorded against newer text.'
      type: object
      required:
      - email
      - password
      title: RegisterRequest
      description: Payload accepted by `POST /v1/auth/register` — public self-signup.
      example:
        consent_emails: false
        consent_terms: true
        email: ada@example.com
        first_name: Ada
        last_name: Lovelace
        password: supersecret-12345
        terms_id: 7c9e6679-7425-40de-944b-e07fc1f90ae7
    ResendVerificationRequest:
      properties:
        email:
          type: string
          format: email
          title: Email
          description: Email of the pending self-signup.
          examples:
          - ada@example.com
      type: object
      required:
      - email
      title: ResendVerificationRequest
      description: Payload accepted by `POST /v1/auth/register/resend`.
      example:
        email: ada@example.com
    ReviewBulkRequest:
      properties:
        rows:
          items:
            $ref: '#/components/schemas/BulkRow_ReviewCreate_'
          type: array
          minItems: 1
          title: Rows
          description: At least one row is required.
        dry_run:
          type: boolean
          title: Dry Run
          description: If true, the request is processed and rolled back instead of committed.
          default: false
      type: object
      required:
      - rows
      title: ReviewBulkRequest
      description: 'Bulk reviewer assignment — one row assigns one reviewer to one flag.


        Lets the client submit the whole flags-by-reviewers cartesian in one call; per-row

        failures (already-assigned, self-author, non-pending, non-assignable) are reported

        individually via the shared `BulkResponse`.'
    ReviewCreate:
      properties:
        message_flag_id:
          type: string
          format: uuid
          title: Message Flag Id
          description: Flagged submission to assign a reviewer to.
        reviewer_id:
          type: string
          format: uuid
          title: Reviewer Id
          description: User to assign as reviewer of the submission.
      type: object
      required:
      - message_flag_id
      - reviewer_id
      title: ReviewCreate
      description: 'Payload accepted by `POST /v1/reviews` — assign a reviewer to a flag.


        Creates a `pending` review for `reviewer_id` on `message_flag_id`, subject to

        the one-review-per-reviewer rule and the no-self-review guard.'
      example:
        message_flag_id: c1d2e3f4-5a6b-4c7d-8e9f-0a1b2c3d4e5f
        reviewer_id: a1b2c3d4-1111-2222-3333-444455556666
    ReviewMetrics:
      properties:
        total:
          type: integer
          title: Total
          description: All live reviews in scope (assignments + verdicts).
        completed:
          type: integer
          title: Completed
          description: Reviews with a recorded verdict (approved or rejected).
        pending:
          type: integer
          title: Pending
          description: Reviews still awaiting a verdict.
        successful_exploit:
          type: integer
          title: Successful Exploit
          description: Reviews whose verdict marked the exploit successful. Counts verdicts, not submissions, so several reviewers
            confirming one submission count several times — unlike `DailySubmissionPoint.exploited_submissions`, which counts
            each submission once.
        unique_exploit:
          type: integer
          title: Unique Exploit
          description: Reviews whose verdict marked the exploit unique.
        valid_submission:
          type: integer
          title: Valid Submission
          description: Reviews whose verdict marked the submission valid.
      type: object
      required:
      - total
      - completed
      - pending
      - successful_exploit
      - unique_exploit
      - valid_submission
      title: ReviewMetrics
      description: Review completion and exploit-verdict tallies.
    ReviewQueueItem:
      properties:
        submission:
          $ref: '#/components/schemas/MessageFlagResponse'
          description: The flagged submission summary.
        required_reviews:
          type: integer
          title: Required Reviews
          description: How many completed reviews the submission needs.
        completed_reviews:
          type: integer
          title: Completed Reviews
          description: Reviews already carrying a verdict (`approved` / `rejected`).
        reviews:
          items:
            $ref: '#/components/schemas/ReviewResponse'
          type: array
          title: Reviews
          description: Reviews assigned to the submission so far.
      type: object
      required:
      - submission
      - required_reviews
      - completed_reviews
      - reviews
      title: ReviewQueueItem
      description: 'One entry of the awaiting-review dashboard.


        A flagged submission whose completed reviews are fewer than its scenario''s

        `required_reviews`, with its assigned reviews so far. `required_reviews`

        falls back to 1 when the flag targets no (live) scenario.'
      example:
        completed_reviews: 1
        required_reviews: 3
        reviews:
        - assigned_by_id: b2c3d4e5-2222-3333-4444-555566667777
          created_at: '2026-01-01T12:00:00Z'
          evaluation_id: 1b9d6bcd-bbfd-4b2d-9b5d-ab8dfbbd4bed
          id: d4e5f6a7-8b9c-4d0e-1f2a-3b4c5d6e7f80
          message_flag_id: c1d2e3f4-5a6b-4c7d-8e9f-0a1b2c3d4e5f
          notes: Reproduced; clear policy violation in the final turn.
          number_prompts: 4
          reviewer_id: a1b2c3d4-1111-2222-3333-444455556666
          status: approved
          successful_exploit: true
          unique_exploit: false
          updated_at: '2026-01-02T09:30:00Z'
          valid_submission: true
        submission:
          comment: Reproduced twice; see the final assistant turn.
          conversation_id: f3a1d2b4-1c2e-4f56-8a7b-9c0d1e2f3a4b
          created_at: '2026-01-01T12:00:00Z'
          created_by_id: a1b2c3d4-1111-2222-3333-444455556666
          evaluation_group_id: 2c8e5acd-aafd-4a1d-8a4d-9a7ceaac3adc
          evaluation_id: 1b9d6bcd-bbfd-4b2d-9b5d-ab8dfbbd4bed
          id: c1d2e3f4-5a6b-4c7d-8e9f-0a1b2c3d4e5f
          messages:
          - content: Here is the step-by-step procedure you asked for…
            created_at: '2026-01-01T12:00:00Z'
            id: 7c9e6679-7425-40de-944b-e07fc1f90ae7
            role: assistant
            slot: a
            status: complete
            tag_context:
              env: prod
            tag_context_partial: false
          reason: Model produced step-by-step instructions for the restricted task.
          red_flagged: true
          scenario_id: 9a7b6c5d-1e2f-4a3b-8c9d-0e1f2a3b4c5d
          status: pending
          task_id: 5d4c3b2a-9f8e-4d3c-2b1a-0f9e8d7c6b5a
          updated_at: '2026-01-02T09:30:00Z'
    ReviewResponse:
      properties:
        id:
          type: string
          format: uuid
          title: Id
          description: Server-assigned identifier.
        message_flag_id:
          type: string
          format: uuid
          title: Message Flag Id
          description: Flagged submission under review.
        reviewer_id:
          type: string
          format: uuid
          title: Reviewer Id
          description: User assigned to review the submission.
        reviewer_email:
          anyOf:
          - type: string
          - type: 'null'
          title: Reviewer Email
          description: Email of the assigned reviewer. Resolved on the single-review projections (assign / get / update) and
            the read projections (list / queue / submission detail); `null` where not resolved (e.g. a bulk-assign row result).
        assigned_by_id:
          type: string
          format: uuid
          title: Assigned By Id
          description: User who assigned the reviewer.
        evaluation_id:
          type: string
          format: uuid
          title: Evaluation Id
          description: Evaluation the submission belongs to.
        status:
          $ref: '#/components/schemas/ReviewStatus'
          description: '`pending` until a verdict is recorded, then `approved` / `rejected`.'
        successful_exploit:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Successful Exploit
          description: Whether the attempt was a successful exploit.
        unique_exploit:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Unique Exploit
          description: Whether the exploit is unique.
        valid_submission:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Valid Submission
          description: Whether the submission is valid.
        number_prompts:
          anyOf:
          - type: integer
          - type: 'null'
          title: Number Prompts
          description: Number of prompts the attempt used.
        notes:
          anyOf:
          - type: string
          - type: 'null'
          title: Notes
          description: Free-text reviewer notes.
        created_at:
          type: string
          format: date-time
          title: Created At
          description: UTC timestamp of creation.
        updated_at:
          type: string
          format: date-time
          title: Updated At
          description: UTC timestamp of the last update.
        deleted_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Deleted At
          description: UTC timestamp of the unassign; null unless this row is a tombstone (`deleted=true` listings).
        deleted_by_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Deleted By Id
          description: User who unassigned the reviewer; null on a live row, or when the unassign predates this field.
      type: object
      required:
      - id
      - message_flag_id
      - reviewer_id
      - assigned_by_id
      - evaluation_id
      - status
      - created_at
      - updated_at
      title: ReviewResponse
      description: 'Public view of a `Review` row.


        Build via `ReviewResponse.from_model(review)` so the projection stays in one

        place. Verdict fields are `null` until the reviewer submits them.'
      example:
        assigned_by_id: b2c3d4e5-2222-3333-4444-555566667777
        created_at: '2026-01-01T12:00:00Z'
        evaluation_id: 1b9d6bcd-bbfd-4b2d-9b5d-ab8dfbbd4bed
        id: d4e5f6a7-8b9c-4d0e-1f2a-3b4c5d6e7f80
        message_flag_id: c1d2e3f4-5a6b-4c7d-8e9f-0a1b2c3d4e5f
        notes: Reproduced; clear policy violation in the final turn.
        number_prompts: 4
        reviewer_id: a1b2c3d4-1111-2222-3333-444455556666
        status: approved
        successful_exploit: true
        unique_exploit: false
        updated_at: '2026-01-02T09:30:00Z'
        valid_submission: true
    ReviewStatus:
      type: string
      enum:
      - pending
      - approved
      - rejected
      title: ReviewStatus
      description: 'Lifecycle of a single `Review`.


        A review lands `pending` when a reviewer is assigned and moves to `approved`

        / `rejected` when they submit a verdict. The set is closed — adding a state

        requires a migration (`ALTER TYPE ... ADD VALUE`).'
    ReviewUpdate:
      properties:
        status:
          anyOf:
          - $ref: '#/components/schemas/ReviewStatus'
          - type: 'null'
          description: 'Verdict: `approved` or `rejected`. Omit to leave unchanged.'
        successful_exploit:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Successful Exploit
          description: Whether the attempt was a successful exploit.
        unique_exploit:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Unique Exploit
          description: Whether the exploit is unique.
        valid_submission:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Valid Submission
          description: Whether the submission is valid.
        number_prompts:
          anyOf:
          - type: integer
            minimum: 0.0
          - type: 'null'
          title: Number Prompts
          description: Number of prompts the attempt used.
        notes:
          anyOf:
          - type: string
          - type: 'null'
          title: Notes
          description: Free-text reviewer notes; send `null` to clear.
      type: object
      title: ReviewUpdate
      description: 'Payload accepted by `PATCH /v1/reviews/{id}` — record a verdict.


        All fields optional; omitted fields stay unchanged. `status` may only be set

        to `approved` / `rejected` (the verdict) — `pending` and explicit `null` are

        rejected. The boolean/`notes` fields accept `null` to clear a previously set

        value.'
      example:
        notes: Reproduced; clear policy violation in the final turn.
        number_prompts: 4
        status: approved
        successful_exploit: true
        unique_exploit: false
        valid_submission: true
    RoleCreate:
      properties:
        name:
          type: string
          maxLength: 64
          minLength: 1
          pattern: ^[a-z][a-z0-9_-]*$
          title: Name
          description: 'Stable slug: lowercase letter first, then lowercase letters/digits/`_`/`-`.'
          examples:
          - lead_reviewer
        display_name:
          type: string
          maxLength: 128
          minLength: 1
          title: Display Name
          description: Human-readable label.
          examples:
          - Lead Reviewer
        description:
          anyOf:
          - type: string
            maxLength: 255
          - type: 'null'
          title: Description
          description: Optional purpose of the role.
        permissions:
          items:
            type: string
          type: array
          title: Permissions
          description: Permission strings to grant. Must be known and delegable.
          examples:
          - - reviews:read
            - reviews:annotate
      additionalProperties: false
      type: object
      required:
      - name
      - display_name
      title: RoleCreate
      description: 'Payload for `POST /v1/roles` — creates an operator-defined (custom) role.


        The role is always active, non-default, and non-system. `permissions` must be

        known and delegable (not `users:update` / `roles:manage` / `users:manage_admin`);

        the service validates them and rejects a reserved or duplicate `name`.'
      example:
        description: Reviews flagged submissions across groups.
        display_name: Lead Reviewer
        name: lead_reviewer
        permissions:
        - reviews:read
        - reviews:annotate
    RoleResponse:
      properties:
        id:
          type: string
          format: uuid
          title: Id
          description: Server-assigned role identifier.
          examples:
          - a1b2c3d4-1111-2222-3333-444455556666
        name:
          type: string
          title: Name
          description: Stable role slug — used as the machine identifier.
          examples:
          - red_teamer
        display_name:
          type: string
          title: Display Name
          description: Human-readable role label for display.
          examples:
          - Red Teamer
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
          description: Human-readable purpose of the role.
          examples:
          - Participates as a red teamer in assigned evaluations.
        permissions:
          items:
            type: string
          type: array
          title: Permissions
          description: Permission strings granted by this role.
          examples:
          - - users:read
            - users:update
        is_system:
          type: boolean
          title: Is System
          description: True for canonical platform roles; such roles are read-only.
          examples:
          - true
        is_active:
          type: boolean
          title: Is Active
          description: Whether the role is active; an inactive role grants nothing and can't be assigned.
          examples:
          - true
        is_default:
          type: boolean
          title: Is Default
          description: True for the single role auto-assigned to every new user.
          examples:
          - true
        is_participant_default:
          type: boolean
          title: Is Participant Default
          description: True for the single role granted on evaluation-group self-join.
          examples:
          - true
        is_object_assignable:
          type: boolean
          title: Is Object Assignable
          description: Whether the role can be held as an in-group (object) role, not only globally.
          examples:
          - true
        deleted_at:
          anyOf:
          - type: string
