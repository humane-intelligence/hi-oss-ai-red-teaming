    DailySubmissionPoint:
      properties:
        day:
          type: string
          format: date
          title: Day
          description: The UTC calendar day these counts fall on.
          examples:
          - '2026-08-03'
        submissions:
          type: integer
          title: Submissions
          description: Live submissions created on this day.
        exploited_submissions:
          type: integer
          title: Exploited Submissions
          description: Of those submissions, the ones carrying a confirmed successful-exploit review. Counted once per submission
            however many reviewers confirmed it, and dated by the submission rather than the review — so it is never greater
            than `submissions`. Deliberately *not* the same measure as `reviews.successful_exploit`, which counts verdicts
            and so runs higher when several reviewers confirm one submission.
      type: object
      required:
