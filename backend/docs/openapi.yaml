    SavedViewState:
      properties:
        order_by:
          anyOf:
          - type: string
            maxLength: 64
            pattern: ^-?[a-zA-Z_][a-zA-Z0-9_]*$
          - type: 'null'
          title: Order By
          description: Sort token; optional leading `-` selects descending.
        filters:
          additionalProperties: true
