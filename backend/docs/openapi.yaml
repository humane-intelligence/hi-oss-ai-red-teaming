      description: Clear an unassigned review's `deleted_at`, putting the reviewer back on the submission with any verdict
        they had recorded. Restorable for a fixed window after the unassign (set per deployment), and only your own unassignment
        unless you hold the break-glass (`evaluation_groups:manage`), which restores any actor's; a decided review additionally
        only by the reviewer who recorded it or that break-glass. A `pending` review is restored only while it is still actionable
        — the submission undecided and the reviewer live and assignable, as on a fresh assignment. The reviewer is emailed
        as on a fresh assignment (a decided review's since-deleted reviewer is not).
