<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light only">
<meta name="supported-color-schemes" content="light only">
<title>{{ brand.product }}</title>
</head>
<body style="margin:0;padding:0;background-color:#eaf0ee;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse;background-color:#eaf0ee;">
<tr>
<td align="center" style="padding:32px 16px;">
<table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse;width:600px;max-width:600px;background-color:#ffffff;border:1px solid #e4ebe9;border-radius:8px;overflow:hidden;">
<tr>
<td align="center" style="padding:40px 48px 0;">
<img src="cid:logo" width="176" alt="{{ brand.product }}" style="display:block;width:176px;max-width:60%;height:auto;border:0;">
</td>
</tr>
<tr>
<td style="padding:28px 48px 0;">
<div style="height:3px;line-height:3px;font-size:3px;background-color:#e59a33;border-radius:2px;">&nbsp;</div>
</td>
</tr>
<tr>
<td style="padding:26px 48px 8px;">
{% block content %}{% endblock %}
</td>
</tr>
<tr>
<td style="padding:16px 48px 36px;">
<div style="border-top:1px solid #eef2f0;padding-top:20px;text-align:center;">
<p style="margin:0;font-family:Helvetica,Arial,sans-serif;font-size:12px;line-height:1.6;color:#8b9c9e;">{{ brand.company }} · {{ brand.product }}</p>
<p style="margin:8px 0 0;font-family:Helvetica,Arial,sans-serif;font-size:12px;line-height:1.6;color:#8b9c9e;"><a href="{{ brand.site_url }}" style="color:#0c8478;text-decoration:none;">{{ brand.site_label }}</a>{% if brand.footer_address %} &nbsp;·&nbsp; {{ brand.footer_address }}{% endif %}</p>
</div>
</td>
</tr>
</table>
</td>
</tr>
</table>
</body>
</html>
