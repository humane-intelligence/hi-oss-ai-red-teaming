[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os

# Migration filenames: YYYYMMDD_HHMM_<short-rev>_<slug>.py
# Example: 20260513_1430_a1b2c3d4_create_users_table.py
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# sqlalchemy.url is set programmatically in alembic/env.py from app.core.config.
# This placeholder is never used at runtime but must be a valid DSN format.
sqlalchemy.url = postgresql+asyncpg://user:pass@localhost/dbname

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
