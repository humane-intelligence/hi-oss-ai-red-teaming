apiVersion: 1

groups:
  - orgId: 1
    name: uptime
    folder: alerts
    interval: 1m
    rules:
      - uid: probe-down
        title: Probe down (/health)
        condition: C
        for: 5m
        noDataState: Alerting
        execErrState: Alerting
        annotations:
          description: probe_success has been 0 for 5+ minutes — /health is unreachable.
        labels:
          severity: critical
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 600
              to: 0
            model:
              expr: probe_success{job="blackbox"}
              instant: true
              refId: A
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 600
              to: 0
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 600
              to: 0
            model:
              type: threshold
              expression: B
              refId: C
              conditions:
                - evaluator:
                    type: lt
                    params: [1]
                  operator:
                    type: and
                  query:
                    params: ["C"]
                  reducer:
                    type: last
                  type: query
