# Path → PR label map for actions/labeler (triage only; does not gate CI).
backend:
  - changed-files:
      - any-glob-to-any-file: 'backend/**'
frontend:
  # generated typed client is regenerated by backend PRs — don't flag those as FE work
  - changed-files:
      - all-globs-to-any-file:
          - 'frontend/**'
          - '!frontend/src/lib/api/schema.d.ts'
deploy:
  - changed-files:
      - any-glob-to-any-file: 'deploy/**'
ci:
  - changed-files:
      - any-glob-to-any-file: '.github/**'
docs:
  - changed-files:
      - any-glob-to-any-file: 'backend/docs/knowledge-base/**'
